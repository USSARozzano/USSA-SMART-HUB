<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061827"><title>USSA SMART HUB · V2</title>
<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--navy);color:var(--white);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{height:100vh;overflow:hidden}button{font:inherit}.app{width:min(100vw,1080px);height:100vh;margin:auto;padding:18px;background:linear-gradient(180deg,#071c30,#061827)}
.header{height:118px;display:grid;grid-template-columns:104px 1fr 220px;align-items:center;gap:18px;margin-bottom:12px}.logo{width:92px;height:92px;object-fit:contain}.brand{text-align:center;font-size:42px;font-weight:950;letter-spacing:.2px}.brand .smart{color:var(--yellow)}.datetime{text-align:right}.clock{font-size:39px;font-weight:950;line-height:1}.date{margin-top:8px;color:var(--yellow);font-size:14px;font-weight:900;text-transform:uppercase}
.home{height:calc(100vh - 148px);display:grid;grid-template-rows:36% 12% 1fr;gap:12px}.card,.now,.info{border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,var(--card2),var(--card));box-shadow:var(--shadow);overflow:hidden}.head{height:54px;padding:0 18px;display:flex;align-items:center;justify-content:space-between}.head h2{margin:0;color:var(--yellow);font-size:20px;font-weight:950}.schedule{height:calc(100% - 54px);overflow-y:auto;overscroll-behavior:contain;padding:0 12px 12px;scrollbar-width:thin}.appointment{width:100%;min-height:94px;display:grid;grid-template-columns:95px 82px 1fr 104px 26px;gap:12px;align-items:center;border:0;border-top:1px solid rgba(53,91,118,.7);background:transparent;color:white;text-align:left;padding:10px 5px;cursor:pointer}.appointment:first-child{border-top:0}.a-day{font-size:11px;font-weight:950;color:var(--muted);text-transform:uppercase}.a-date{font-size:18px;font-weight:950;line-height:1.05}.a-time{font-size:27px;color:var(--yellow);font-weight:950}.a-kind{font-size:10px;color:var(--yellow);font-weight:950;letter-spacing:.4px}.a-title{font-size:17px;font-weight:950;line-height:1.12;margin-top:3px}.a-venue{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{justify-self:end;border:1px solid var(--line);border-radius:999px;padding:8px 10px;font-size:10px;font-weight:950;text-align:center}.badge.home{color:var(--yellow);border-color:#806e27}.badge.away{color:#d7e6f2}.chev{font-size:25px;color:var(--muted)}
.middle{display:grid;grid-template-columns:1.65fr .7fr;gap:12px}.now,.info{height:100%;color:white}.now{padding:16px 19px;position:relative;text-align:left}.eyebrow{font-size:11px;font-weight:950;color:var(--yellow)}.now-title{font-size:27px;font-weight:950;margin-top:7px;line-height:1.06}.now-meta{font-size:12px;color:var(--muted);margin-top:6px}.dots{position:absolute;right:16px;bottom:10px;color:var(--muted);letter-spacing:4px}.info{display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}.info-icon{font-size:38px}.info-label{font-size:16px;font-weight:950;margin-top:3px}.open{display:none;margin-top:7px;font-size:10px;color:var(--green);font-weight:950;text-align:center}.open.show{display:block}
.teams{display:flex;flex-direction:column;min-height:0}.team-grid{height:calc(100% - 54px);padding:10px 12px 12px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,minmax(0,1fr));gap:8px}.team{border:1px solid #6d5d20;border-radius:14px;background:#09243b;color:white;min-height:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;cursor:pointer;text-align:center}.team .icon{font-size:22px}.team .name{font-size:13px;font-weight:950;line-height:1.05}.team.test{border-style:dashed;opacity:.78}
.empty{color:var(--muted);font-size:14px;padding:18px}.overlay{position:fixed;inset:0;background:var(--navy);z-index:20;display:none;overflow:hidden}.overlay.show{display:block}.screen{width:min(100vw,1080px);height:100vh;margin:auto;padding:18px;background:linear-gradient(180deg,#071c30,#061827);overflow-y:auto}.screenbar{height:72px;display:grid;grid-template-columns:76px 1fr 76px;align-items:center;position:sticky;top:-18px;background:#071c30;z-index:10;margin-bottom:12px}.backbtn{border:1px solid var(--line);border-radius:13px;background:var(--card);color:white;padding:12px;cursor:pointer}.screentitle{text-align:center;color:var(--yellow);font-size:22px;font-weight:950}.hero,.section{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:18px;margin-bottom:12px}.hero h1{margin:0;color:var(--yellow);font-size:34px}.hero p{margin:6px 0 0;color:var(--muted);font-weight:850}.section h3{margin:0 0 11px;color:var(--yellow);font-size:15px}.kv{display:grid;gap:6px}.kvrow{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line)}.kvrow:last-child{border-bottom:0}.kvrow span{color:var(--muted);text-align:right}.training-fixed{margin-bottom:12px}.comp-row{display:flex;gap:8px;margin:0 0 10px}.compbtn{flex:1;border:1px solid var(--line);border-radius:13px;background:var(--card);color:white;padding:13px;font-weight:950}.compbtn.active{background:var(--yellow);color:#071827;border-color:var(--yellow)}.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px;margin-bottom:12px}.action{min-height:72px;border:1px solid var(--line);border-radius:14px;background:var(--card2);color:white;font-weight:950;font-size:15px;padding:10px;cursor:pointer}.action.active{background:var(--yellow);border-color:var(--yellow);color:#071827}.dynamic{min-height:650px;border:1px solid var(--line);border-radius:18px;background:rgba(8,34,55,.72);padding:14px}.dynamic:empty{display:none}
table{width:100%;border-collapse:collapse;font-size:14px}th{background:#071a2c;color:var(--yellow);padding:11px 7px;text-align:left;position:sticky;top:72px}td{padding:11px 7px;border-bottom:1px solid var(--line)}tr.us td{background:var(--yellow);color:#07131d;font-weight:950}.staffgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.staffcard{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:14px;text-align:center}.staffphoto{width:104px;height:118px;margin:auto;border-radius:13px;background:linear-gradient(145deg,#173f5f,#0a2740);display:flex;align-items:center;justify-content:center;color:var(--yellow);font-size:32px;font-weight:950;overflow:hidden}.staffphoto img{width:100%;height:100%;object-fit:cover}.staffrole{font-size:12px;color:var(--muted);margin-top:10px}.staffname{font-size:16px;font-weight:950;margin-top:3px}.collabs{margin-top:15px}.matchcard{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:15px;margin-bottom:9px;cursor:pointer}.matchhead{display:flex;justify-content:space-between;gap:12px}.matchdate{color:var(--yellow);font-weight:950;font-size:13px}.matchtitle{font-size:19px;font-weight:950;margin-top:7px}.small{font-size:12px;color:var(--muted);margin-top:5px}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:10px;font-weight:950;height:max-content}.detailhint{margin-top:10px;color:var(--yellow);font-size:11px;font-weight:950}.loading{position:fixed;inset:0;z-index:50;background:rgba(3,13,22,.9);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}.loading.show{display:flex}.spinner{width:48px;height:48px;border:4px solid #294964;border-top-color:var(--yellow);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.fixturehero{text-align:center;padding:25px 18px}.fixturemeta{color:var(--yellow);font-weight:950;font-size:13px}.fixtureteams{display:grid;grid-template-columns:1fr 80px 1fr;align-items:center;gap:14px;margin-top:20px}.fixtureteam{font-size:27px;font-weight:950;line-height:1.05}.vs{font-size:18px;color:var(--muted);font-weight:950}.fixturewhen{margin-top:22px;font-size:23px;font-weight:950}.fixturewhen b{color:var(--yellow)}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detailblock{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:18px}.detailblock h3{margin:0 0 12px;color:var(--yellow);font-size:15px}.venue-name{font-size:22px;font-weight:950}.address{color:var(--muted);margin-top:6px}.routebig{font-size:31px;font-weight:950}.routebig span{color:var(--yellow)}.qrrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.qrcard{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:16px;display:grid;grid-template-columns:145px 1fr;gap:15px;align-items:center}.qrcard img{width:145px;height:145px;background:white;border-radius:10px;padding:6px}.qrt{font-size:18px;font-weight:950}.qrs{font-size:11px;color:var(--muted);margin-top:5px}.mapbox{height:300px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#0a2339;margin-top:12px}.mapbox iframe{width:100%;height:100%;border:0}.info-menu{display:grid;gap:12px}.infocard{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:16px}.infocard h3{margin:0 0 10px;color:var(--yellow)}.idle{position:fixed;inset:0;background:radial-gradient(circle at center,#0d3351,#061827 68%);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column}.idle.show{display:flex}.idle img{width:min(54vw,440px);opacity:.24}.idle strong{margin-top:30px;color:var(--yellow);font-size:22px;letter-spacing:2px;animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}
@media(max-width:700px){body{overflow:auto}.app{height:auto;min-height:100vh;padding:10px}.header{grid-template-columns:70px 1fr 100px;height:96px}.logo{width:66px;height:66px}.brand{font-size:23px}.clock{font-size:27px}.date{font-size:9px}.home{height:auto;display:block}.home>section,.middle{margin-bottom:10px}.card:first-child{height:450px}.middle{height:190px}.teams{height:auto}.team-grid{height:auto;grid-template-columns:repeat(3,1fr);grid-template-rows:none}.team{min-height:80px}.appointment{grid-template-columns:70px 62px 1fr 22px}.badge{display:none}.staffgrid,.detailgrid,.qrrow{grid-template-columns:1fr}.fixtureteams{grid-template-columns:1fr;}.vs{padding:3px}.qrcard{grid-template-columns:110px 1fr}.qrcard img{width:110px;height:110px}.dynamic{min-height:300px}}
</style></head><body>
<div class="app"><header class="header"><img class="logo" src="/assets/ussa-logo.png" alt="USSA Rozzano"><div class="brand">USSA <span class="smart">SMART HUB</span></div><div class="datetime"><div id="clock" class="clock">--:--</div><div id="date" class="date"></div></div></header>
<main class="home"><section class="card"><div class="head"><h2>PROSSIMI APPUNTAMENTI</h2></div><div id="schedule" class="schedule"><div class="empty">Caricamento…</div></div></section>
<section class="middle"><button id="now" class="now" onclick="openNowTeam()"><div class="eyebrow">ORA IN CAMPO</div><div id="nowTitle" class="now-title">Nessuna attività in corso</div><div id="nowMeta" class="now-meta"></div><div id="dots" class="dots"></div></button><button class="info" onclick="openInfo()"><div class="info-icon">ⓘ</div><div class="info-label">INFO</div><div id="secretaryOpen" class="open">● SEGRETERIA APERTA ORA</div></button></section>
<section class="card teams"><div class="head"><h2>LE NOSTRE SQUADRE</h2></div><div id="teamGrid" class="team-grid"></div></section></main></div>
<div id="overlay" class="overlay"><div class="screen"><div class="screenbar"><button class="backbtn" onclick="goBack()">←</button><div id="screenTitle" class="screentitle"></div><div></div></div><div id="screenBody"></div></div></div>
<div id="loading" class="loading"><div class="spinner"></div><strong>Caricamento dati…</strong></div><div id="idle" class="idle" onclick="wake()"><img src="/assets/ussa-logo.png"><strong>TOCCA LO SCHERMO</strong></div>
<script>
const $=id=>document.getElementById(id);let teams=[],hub={},currentTeam=null,currentCompetition='CSI',teamTab=null,detailReturn=null,nowItems=[],nowIdx=0,nowTimer=null,idleTimer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function getJSON(url){let r=await fetch(url);if(!r.ok)throw new Error('Dati non disponibili');return r.json()}function loading(v){$('loading').classList.toggle('show',v)}
function fmtDate(iso){let d=new Date(iso+'T12:00');return {day:d.toLocaleDateString('it-IT',{weekday:'short'}).replace('.','').toUpperCase(),date:d.toLocaleDateString('it-IT',{day:'2-digit',month:'short'}).replace('.','').toUpperCase(),long:d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}}
function clock(){let d=new Date();$('clock').textContent=d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});$('date').textContent=d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});let sec=hub.secretariat||{},m=d.getHours()*60+d.getMinutes(),o=(sec.open||'00:00').split(':').map(Number),c=(sec.close||'00:00').split(':').map(Number),open=(sec.days||[]).includes(d.getDay()===0?7:d.getDay())&&m>=o[0]*60+o[1]&&m<c[0]*60+c[1];$('secretaryOpen').classList.toggle('show',open)}
async function boot(){[teams,hub]=await Promise.all([getJSON('/api/teams'),getJSON('/api/hub')]);renderTeams();await Promise.all([loadSchedule(),loadNow()]);clock();setInterval(clock,1000);resetIdle()}
function renderTeams(){$('teamGrid').innerHTML=teams.filter(t=>t.visible!==false).slice(0,20).map(t=>`<button class="team ${t.test_only?'test':''}" onclick="openTeam('${t.key}')"><span class="icon">${t.icon||'●'}</span><span class="name">${esc(t.label)}</span></button>`).join('')}
async function loadSchedule(){let d=await getJSON('/api/home/upcoming'),a=d.items||[];$('schedule').innerHTML=a.length?a.map((x,i)=>{let f=fmtDate(x.date),away=x.home_away==='TRASFERTA';return `<button class="appointment" onclick='openAppointment(${JSON.stringify(x).replace(/'/g,"&#39;")})'><div><div class="a-day">${f.day}</div><div class="a-date">${f.date}</div></div><div class="a-time">${esc(x.time||'--:--')}</div><div><div class="a-kind">${esc(x.meta||x.kind||'APPUNTAMENTO')}${x.competition?' · '+esc(x.competition):''}</div><div class="a-title">${esc(x.title||'')}</div><div class="a-venue">${esc(x.field||'')}</div></div>${x.home_away?`<div class="badge ${away?'away':'home'}">${esc(x.home_away)}</div>`:'<div></div>'}<div class="chev">›</div></button>`}).join(''):'<div class="empty">Nessun appuntamento futuro pubblicato.</div>'}
async function loadNow(){let d=await getJSON('/api/home/now');nowItems=d.items||[];nowIdx=0;renderNow();clearInterval(nowTimer);if(nowItems.length>1)nowTimer=setInterval(()=>{nowIdx=(nowIdx+1)%nowItems.length;renderNow()},6000)}
function renderNow(){let x=nowItems[nowIdx];if(!x){$('nowTitle').textContent='Nessuna attività in corso';$('nowMeta').textContent='';$('dots').textContent='';return}$('nowTitle').textContent=x.title;$('nowMeta').textContent=`${x.kind} · ${x.meta||''}${x.place?' · '+x.place:''}`;$('dots').textContent=nowItems.length>1?'• '.repeat(Math.min(nowItems.length,4)):''}
function openNowTeam(){let x=nowItems[nowIdx];if(x?.team_key)openTeam(x.team_key)}function showOverlay(title,body){$('screenTitle').textContent=title;$('screenBody').innerHTML=body;$('overlay').classList.add('show');document.querySelector('#overlay .screen').scrollTop=0}
function closeOverlay(){$('overlay').classList.remove('show');currentTeam=null;teamTab=null;detailReturn=null}
function trainingHTML(t){let a=t.training||[];return a.length?`<div class="kv">${a.map(x=>`<div class="kvrow"><b>${esc(x.day)}</b><span>${esc(x.start)}–${esc(x.end)} · ${esc(x.place)}</span></div>`).join('')}</div>`:'<div class="empty">Allenamenti non ancora inseriti.</div>'}
function initials(n){return n.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function staffHTML(t){let a=t.staff||[],coll=t.collaborators||[];let main=a.length?`<div class="staffgrid">${a.map(x=>`<div class="staffcard"><div class="staffphoto">${x.photo?`<img src="${esc(x.photo)}">`:esc(initials(x.name))}</div><div class="staffrole">${esc(x.role)}</div><div class="staffname">${esc(x.name)}</div></div>`).join('')}</div>`:'<div class="empty">Staff non disponibile.</div>';if(coll.length)main+=`<div class="collabs"><h3>COLLABORATORI</h3>${coll.map(x=>`<div class="kvrow"><b>${esc(x.name)}</b><span>${esc(x.role||'Collaboratore')}</span></div>`).join('')}</div>`;return main}
async function openTeam(key,restoreTab=null,restoreComp=null){let t=teams.find(x=>x.key===key);if(!t)return;currentTeam=t;currentCompetition=restoreComp||t.default_competition||(t.competitions?.[0])||'CSI';teamTab=restoreTab;detailReturn=null;await renderTeamScreen()}
async function renderTeamScreen(){let t=currentTeam;if(!t)return;let comps=t.competitions||[];let compHTML=comps.length>1?`<div class="comp-row">${comps.map(c=>`<button class="compbtn ${c===currentCompetition?'active':''}" onclick="changeCompetition('${c}')">${c}</button>`).join('')}</div>`:'';showOverlay(t.label,`<div class="hero"><h1>${esc(t.label)}</h1><p>${esc(t.sport)}${t.test_only?' · SQUADRA TEST CSI':''}</p></div><div class="section training-fixed"><h3>ALLENAMENTI</h3>${trainingHTML(t)}</div>${compHTML}<div id="teamActions" class="actions"><button class="action ${teamTab==='staff'?'active':''}" onclick="selectTeamTab('staff')">STAFF</button></div><div id="dynamic" class="dynamic"></div>`);await refreshAvailability();if(teamTab)await selectTeamTab(teamTab,true);else $('dynamic').innerHTML='<div class="empty">Seleziona una voce disponibile per consultare i dati della squadra.</div>'}
async function changeCompetition(c){currentCompetition=c;teamTab=null;await renderTeamScreen()}
async function refreshAvailability(){let a={};try{a=await getJSON(`/api/team/${currentTeam.key}/availability?competition=${encodeURIComponent(currentCompetition)}`)}catch{}let labels={standings:'CLASSIFICA',scorers:'MARCATORI',played:'GARE DISPUTATE',next:'PROSSIME PARTITE'};let order=['standings','scorers','played','next'];$('teamActions').innerHTML=`<button class="action ${teamTab==='staff'?'active':''}" onclick="selectTeamTab('staff')">STAFF</button>`+order.filter(k=>a[k]).map(k=>`<button class="action ${teamTab===k?'active':''}" onclick="selectTeamTab('${k}')">${labels[k]}</button>`).join('')}
async function selectTeamTab(tab,restoring=false){teamTab=tab;await refreshAvailability();let box=$('dynamic');if(tab==='staff'){box.innerHTML=`<div class="section"><h3>STAFF</h3>${staffHTML(currentTeam)}</div>`;return}loading(true);try{if(tab==='standings'){let d=await getJSON(`/api/team/${currentTeam.key}/standings?competition=${currentCompetition}`);box.innerHTML=`<div class="section"><h3>CLASSIFICA · ${currentCompetition}</h3><table><thead><tr><th>POS</th><th>SQUADRA</th><th>G</th><th>V</th><th>N</th><th>P</th><th>PT</th></tr></thead><tbody>${(d.standings||[]).map(x=>`<tr class="${String(x.team).toUpperCase().includes('USSA')?'us':''}"><td>${x.position??''}</td><td><b>${esc(x.team)}</b></td><td>${x.played??''}</td><td>${x.wins??''}</td><td>${x.draws??''}</td><td>${x.losses??''}</td><td><b>${x.points??''}</b></td></tr>`).join('')}</tbody></table></div>`}else if(tab==='scorers'){let d=await getJSON(`/api/team/${currentTeam.key}/players?competition=${currentCompetition}`);box.innerHTML=`<div class="section"><h3>MARCATORI · ${currentCompetition}</h3><table><thead><tr><th>POS</th><th>GIOCATORE</th><th>GOL</th></tr></thead><tbody>${(d.players||[]).map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.name)}</b></td><td><b>${x.goals}</b></td></tr>`).join('')}</tbody></table></div>`}else{let ep=tab==='played'?'matches':'next',d=await getJSON(`/api/team/${currentTeam.key}/${ep}?competition=${currentCompetition}`),played=tab==='played';box.innerHTML=(d.matches||[]).map(x=>matchCard(x,played)).join('')||'<div class="empty">Nessun dato disponibile.</div>'}}catch(e){box.innerHTML='<div class="empty">Dati momentaneamente non disponibili.</div>'}finally{loading(false)}}
function matchCard(x,played){let title=x.home&&x.away?`${x.home} – ${x.away}`:(x.names?.length?x.names.slice(-2).join(' – '):x.raw||'Partita USSA');let click=x.id?`openFixtureDetail('${x.id}','team')`:(x.detail_url?`openCsiDetail(${JSON.stringify(x.detail_url)})`:``);return `<div class="matchcard" ${click?`onclick='${click}'`:''}><div class="matchhead"><div><div class="matchdate">${fmtDate(x.date).long.toUpperCase()} · ${esc(x.time||'')}</div><div class="matchtitle">${esc(title)}</div><div class="small">${esc(x.field||x.competition||currentCompetition)}${x.address?' · '+esc(x.address):''}</div></div>${x.home_away?`<div class="pill">${esc(x.home_away)}</div>`:''}</div>${click?`<div class="detailhint">${played?'DETTAGLIO GARA':'INFO PARTITA'} ›</div>`:''}</div>`}
function openAppointment(x){if(x.kind==='EVENTO')return openEvent(x);if(x.id)return openFixtureDetail(x.id,'home');showOverlay('PARTITA',`<div class="hero"><h1>${esc(x.title)}</h1><p>${fmtDate(x.date).long} · ${esc(x.time||'')}</p></div>`);detailReturn={type:'home'}}
async function openFixtureDetail(id,origin){loading(true);try{let x=await getJSON(`/api/fixture/${id}`);detailReturn=origin==='team'?{type:'team',key:currentTeam.key,tab:teamTab,comp:currentCompetition}:{type:'home'};let home=x.home_away==='CASA',f=fmtDate(x.date);showOverlay('PARTITA',`<div class="section fixturehero"><div class="fixturemeta">UNDER 14 · ${esc(x.competition)} · ${esc(x.leg)} · GIORNATA ${x.round}</div><div class="fixtureteams"><div class="fixtureteam">${esc(x.home)}</div><div class="vs">VS</div><div class="fixtureteam">${esc(x.away)}</div></div><div class="fixturewhen">${f.long.toUpperCase()} · <b>${esc(x.time)}</b></div><div style="margin-top:12px"><span class="pill">${esc(x.home_away)}</span></div></div><div class="detailgrid"><div class="detailblock"><h3>DOVE SI GIOCA</h3><div class="venue-name">${esc(x.field)}</div><div class="address">${esc(x.address)}</div></div><div id="routeBlock" class="detailblock"><h3>${home?'USSA STADIUM':'PERCORSO DA USSA STADIUM'}</h3>${home?`<div class="routebig"><span>CASA</span></div><div class="address">Sei già nel nostro impianto di riferimento.</div>`:`<div class="empty">Calcolo distanza e tempo indicativo…</div>`}</div></div><div class="qrrow">${home?'':`<div class="qrcard"><img src="/api/qr/route/${x.id}.svg"><div><div class="qrt">PERCORSO SUL TELEFONO</div><div class="qrs">Scansiona il QR per aprire la navigazione verso il campo.</div></div></div>`}<div class="qrcard"><img src="/api/qr/calendar/${x.id}.svg"><div><div class="qrt">AGGIUNGI AL CALENDARIO</div><div class="qrs">Scansiona il QR per salvare partita, data, ora e luogo sul telefono.</div></div></div></div>${home?'':`<div id="mapContainer"></div>`}`);if(!home)loadRoute(x)}catch(e){showOverlay('PARTITA','<div class="section empty">Dettagli partita non disponibili.</div>')}finally{loading(false)}}
async function loadRoute(x){try{let r=await getJSON(`/api/route?address=${encodeURIComponent(x.route_address||x.address)}`);$('routeBlock').innerHTML=`<h3>PERCORSO DA USSA STADIUM</h3><div class="routebig"><span>${r.km} km</span> · circa ${r.minutes} min</div><div class="address">Partenza: USSA Stadium</div>`;let d=r.destination,bbox=[d.lon-.018,d.lat-.012,d.lon+.018,d.lat+.012].join(',');$('mapContainer').innerHTML=`<div class="detailblock" style="margin-top:12px"><h3>MAPPA</h3><div class="mapbox"><iframe src="https://www.openstreetmap.org/export/embed.html?bbox=${encodeURIComponent(bbox)}&layer=mapnik&marker=${d.lat}%2C${d.lon}"></iframe></div></div>`}catch{$('routeBlock').innerHTML='<h3>PERCORSO DA USSA STADIUM</h3><div class="empty">Distanza e tempo momentaneamente non disponibili. Il QR percorso resta utilizzabile.</div>'}}
async function openCsiDetail(url){detailReturn={type:'team',key:currentTeam.key,tab:'played',comp:currentCompetition};loading(true);try{let d=await getJSON(`/api/game-detail?url=${encodeURIComponent(url)}`);showOverlay('DETTAGLIO GARA',`<div class="hero"><h1>${esc(d.score||'PARTITA')}</h1><p>${esc(d.title||'')}</p></div>${d.field?`<div class="section"><h3>CAMPO</h3>${esc(d.field)}</div>`:''}<div class="section"><h3>CRONOLOGIA</h3>${(d.events||[]).length?d.events.map(x=>`<div class="matchcard">${esc(x)}</div>`).join(''):'<div class="empty">Nessun evento di cronaca pubblicato.</div>'}</div>`)}catch{showOverlay('DETTAGLIO GARA','<div class="section empty">Dettaglio CSI momentaneamente non disponibile.</div>')}finally{loading(false)}}
function openEvent(x){detailReturn={type:'home'};showOverlay('EVENTO',`<div class="hero"><h1>${esc(x.title)}</h1><p>${fmtDate(x.date).long} · ${esc(x.time||'')}</p></div><div class="section">${esc(x.description||'Evento USSA')}</div>`)}
function goBack(){if(detailReturn?.type==='team'){let r=detailReturn;detailReturn=null;openTeam(r.key,r.tab,r.comp);return}if(detailReturn?.type==='home'){detailReturn=null;closeOverlay();return}if(currentTeam){closeOverlay();return}closeOverlay()}
function openInfo(){let sec=hub.secretariat||{};detailReturn={type:'home'};showOverlay('INFO',`<div class="info-menu"><div class="infocard"><h3>SEGRETERIA</h3><div class="kv"><div class="kvrow"><b>Orari</b><span>${esc(sec.label||'')} · ${esc(sec.open||'')}–${esc(sec.close||'')}</span></div></div></div><div class="infocard"><h3>SOCIAL & CONTATTI</h3><div class="empty">Area predisposta per contatti, social e QR.</div></div><div class="infocard"><h3>DIRIGENZA</h3><div class="empty">Area predisposta.</div></div><div class="infocard"><h3>PARTNER & SPONSOR</h3><div class="empty">Area predisposta.</div></div></div>`)}
function resetIdle(){clearTimeout(idleTimer);$('idle').classList.remove('show');idleTimer=setTimeout(()=>$('idle').classList.add('show'),(hub.idle_seconds||90)*1000)}function wake(){$('idle').classList.remove('show');resetIdle()}['click','touchstart','mousemove','keydown'].forEach(e=>document.addEventListener(e,resetIdle,{passive:true}));boot().catch(()=>{});
</script></body></html>
