<div class="app"><header class="header"><img class="logo" src="/assets/ussa-logo.png" alt="USSA Rozzano"><div class="brand">USSA <span class="smart">SMART HUB</span></div><div class="datetime"><div id="clock" class="clock">--:--</div><div id="date" class="date"></div></div></header>
<main class="home"><section class="card"><div class="head"><h2>PROSSIMI APPUNTAMENTI</h2></div><div id="schedule" class="schedule"><div class="empty">Caricamento…</div></div></section>
<section class="middle"><button id="now" class="now" onclick="openNowTeam()"><div class="eyebrow">ORA IN CAMPO</div><div id="nowTitle" class="now-title">Nessuna attività in corso</div><div id="nowMeta" class="now-meta"></div><div id="dots" class="dots"></div></button><button class="info" onclick="openInfo()"><div class="info-icon">ⓘ</div><div class="info-label">INFO</div><div id="secretaryOpen" class="open">● SEGRETERIA APERTA ORA</div></button></section>
<section class="card teams"><div class="head"><h2>LE NOSTRE SQUADRE</h2></div><div id="teamGrid" class="team-grid"></div></section></main></div>
<div id="overlay" class="overlay"><div class="screen"><div class="screenbar"><button class="backbtn" onclick="goBack()">←</button><div id="screenTitle" class="screentitle"></div><div></div></div><div id="screenBody"></div></div></div>
<div class="versiontag">V2.2 · UI/NAV/QR/ROUTE</div><div id="loading" class="loading"><div class="spinner"></div><strong>Caricamento dati…</strong></div><div id="idle" class="idle" onclick="wake()"><img src="/assets/ussa-logo.png"><strong>TOCCA LO SCHERMO</strong></div>
<script>
const $=id=>document.getElementById(id);
let teams=[],hub={},nowItems=[],nowIdx=0,nowTimer=null,idleTimer=null;
let navStack=[],currentView={type:'home'};
let currentTeam=null,currentCompetition='CSI',teamTab=null,activeMap=null;
const CLUBS={
 'USSA ROZZANO':{logo:'/assets/ussa-logo.png'},
 'FROG MILANO':{logo:'https://cdn.footballkitarchive.com/2024/11/14/awfvunH2qFLVDEa.jpg',crop:true},
 'SANGIULIANO CVS':{logo:'https://b2-content.tuttocampo.it/TeamPhotos/Original/1000367.png?v=1'},
 'SIZIANO LANTERNA':{logo:'https://sizianolanterna.com/ogfile/shop_it.jpg'},
 'TRIAL ROZZANO':{logo:'https://www.rozzanocalcio.it/wp-content/uploads/2024/10/1202638.png'},
 'VIGE MILANO':{logo:'https://www.vigemilano.it/images/Logo_colori.png'},
 'REAL BASIGLIO':{logo:'https://content-s3.tuttocampo.it/Teams/Original/1202331.png?v=1'},
 'FIVE TO SEVEN':{abbr:'5→7'},
 'AL 2 SPORT':{abbr:'AL2'},
 'FOOTBALL C. MILANESE':{logo:'https://static.wixstatic.com/media/a8c36c_05df221631734d0c925052d1470a4a7e~mv2.png'},
 'ZIBIDO S. GIACOMO':{logo:'https://www.asdzibido.it/images/asd_2018_0003_800px.jpg?crc=4156326406'},
 'FORZA E CORAGGIO':{logo:'https://cdn-eu.wansport.com/forzaecoraggio.wansport.com/d14ccedade3f/azienda/thumb/0a7fd29de302a3f6c218f1bd777ff15dc34f6224.png'},
 'FATIMATRACCIA':{logo:'https://www.csi.milano.it/media/loghi_societa/02001632.jpg'},
 'MILANO F. ACADEMY':{abbr:'MFA'}
};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function getJSON(url){let r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('Dati non disponibili');return r.json()}
function loading(v){$('loading').classList.toggle('show',v)}
function fmtDate(iso){let d=new Date(iso+'T12:00');return {day:d.toLocaleDateString('it-IT',{weekday:'short'}).replace('.','').toUpperCase(),date:d.toLocaleDateString('it-IT',{day:'2-digit',month:'short'}).replace('.','').toUpperCase(),long:d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}}
function clock(){let d=new Date();$('clock').textContent=d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});$('date').textContent=d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});let sec=hub.secretariat||{},m=d.getHours()*60+d.getMinutes(),o=(sec.open||'00:00').split(':').map(Number),c=(sec.close||'00:00').split(':').map(Number),open=(sec.days||[]).includes(d.getDay()===0?7:d.getDay())&&m>=o[0]*60+o[1]&&m<c[0]*60+c[1];$('secretaryOpen').classList.toggle('show',open)}
async function boot(){[teams,hub]=await Promise.all([getJSON('/api/teams'),getJSON('/api/hub')]);renderTeams();await Promise.all([loadSchedule(),loadNow()]);clock();setInterval(clock,1000);resetIdle()}
function renderTeams(){$('teamGrid').innerHTML=teams.filter(t=>t.visible!==false).slice(0,20).map(t=>`<button class="team ${t.test_only?'test':''}" onclick="openTeam('${t.key}')"><span class="icon">${t.icon||'●'}</span><span class="name">${esc(t.label)}</span></button>`).join('')}
async function loadSchedule(){let d=await getJSON('/api/home/upcoming'),a=d.items||[];$('schedule').innerHTML=a.length?a.map(x=>{let f=fmtDate(x.date),away=x.home_away==='TRASFERTA';return `<button class="appointment" onclick='openAppointment(${JSON.stringify(x).replace(/'/g,"&#39;")})'><div><div class="a-day">${f.day}</div><div class="a-date">${f.date}</div></div><div class="a-time">${esc(x.time||'--:--')}</div><div><div class="a-kind">${esc(x.meta||x.kind||'APPUNTAMENTO')}${x.competition?' · '+esc(x.competition):''}</div><div class="a-title">${esc(x.title||'')}</div><div class="a-venue">${esc(x.field||'')}</div></div>${x.home_away?`<div class="badge ${away?'away':'home'}">${esc(x.home_away)}</div>`:'<div></div>'}<div class="chev">›</div></button>`}).join(''):'<div class="empty">Nessun appuntamento futuro pubblicato.</div>'}
async function loadNow(){let d=await getJSON('/api/home/now');nowItems=d.items||[];nowIdx=0;renderNow();clearInterval(nowTimer);if(nowItems.length>1)nowTimer=setInterval(()=>{nowIdx=(nowIdx+1)%nowItems.length;renderNow()},6000)}
function renderNow(){let x=nowItems[nowIdx];if(!x){$('nowTitle').textContent='Nessuna attività in corso';$('nowMeta').textContent='';$('dots').textContent='';return}$('nowTitle').textContent=x.title;$('nowMeta').textContent=`${x.kind} · ${x.meta||''}${x.place?' · '+x.place:''}`;$('dots').textContent=nowItems.length>1?'• '.repeat(Math.min(nowItems.length,4)):''}
function showOverlay(title,body){$('screenTitle').textContent=title;$('screenBody').innerHTML=body;$('overlay').classList.add('show');document.querySelector('#overlay .screen').scrollTop=0}
function hideOverlay(){$('overlay').classList.remove('show');$('screenBody').innerHTML='';if(activeMap){try{activeMap.remove()}catch{}activeMap=null}}
function navigate(view){navStack.push({...currentView});currentView=view;renderCurrent()}
function replaceView(view){currentView=view;renderCurrent()}
function goBack(){if(navStack.length){currentView=navStack.pop();renderCurrent()}else{currentView={type:'home'};hideOverlay()}}
async function renderCurrent(){if(activeMap){try{activeMap.remove()}catch{}activeMap=null}if(currentView.type==='home'){hideOverlay();return}if(currentView.type==='team'){await renderTeamView(currentView);return}if(currentView.type==='fixture'){await renderFixtureView(currentView);return}if(currentView.type==='map'){await renderMapView(currentView);return}if(currentView.type==='csi'){await renderCsiView(currentView);return}if(currentView.type==='info'){renderInfoView();return}if(currentView.type==='event'){renderEventView(currentView.item);return}}
function trainingHTML(t){let a=t.training||[];return a.length?`<div class="kv">${a.map(x=>`<div class="kvrow"><b>${esc(x.day)}</b><span>${esc(x.start)}–${esc(x.end)} · ${esc(x.place)}</span></div>`).join('')}</div>`:'<div class="empty">Allenamenti non ancora inseriti.</div>'}
function initials(n){return n.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function staffHTML(t){let a=t.staff||[],coll=t.collaborators||[];let main=a.length?`<div class="staffgrid">${a.map(x=>`<div class="staffcard"><div class="staffphoto">${x.photo?`<img src="${esc(x.photo)}">`:esc(initials(x.name))}</div><div class="staffrole">${esc(x.role)}</div><div class="staffname">${esc(x.name)}</div></div>`).join('')}</div>`:'<div class="empty">Staff non disponibile.</div>';if(coll.length)main+=`<div class="collabs"><h3>COLLABORATORI</h3>${coll.map(x=>`<div class="kvrow"><b>${esc(x.name)}</b><span>${esc(x.role||'Collaboratore')}</span></div>`).join('')}</div>`;return main}
function openTeam(key){let t=teams.find(x=>x.key===key);if(!t)return;let comp=t.default_competition||(t.competitions?.[0])||'CSI';navigate({type:'team',key,comp,tab:null})}
async function renderTeamView(v){currentTeam=teams.find(x=>x.key===v.key);if(!currentTeam)return;currentCompetition=v.comp;teamTab=v.tab;let t=currentTeam,comps=t.competitions||[];let compHTML=comps.length>1?`<div class="comp-row">${comps.map(c=>`<button class="compbtn ${c===currentCompetition?'active':''}" onclick="changeCompetition('${c}')">${c}</button>`).join('')}</div>`:'';showOverlay(t.label,`<div class="hero"><h1>${esc(t.label)}</h1><p>${esc(t.sport)}${t.test_only?' · SQUADRA TEST CSI':''}</p></div><div class="section training-fixed"><h3>ALLENAMENTI</h3>${trainingHTML(t)}</div>${compHTML}<div id="teamActions" class="actions"></div><div id="dynamic" class="dynamic"></div>`);await refreshAvailability();if(teamTab)await selectTeamTab(teamTab,true);else $('dynamic').innerHTML='<div class="section"><h3>SQUADRA</h3><div class="empty">Scegli una sezione disponibile per consultare i contenuti.</div></div>'}
function changeCompetition(c){currentCompetition=c;teamTab=null;replaceView({type:'team',key:currentTeam.key,comp:c,tab:null})}
async function refreshAvailability(){let a={};try{a=await getJSON(`/api/team/${currentTeam.key}/availability?competition=${encodeURIComponent(currentCompetition)}`)}catch{}let labels={standings:'CLASSIFICA',scorers:'MARCATORI',played:'GARE DISPUTATE',next:'PROSSIME PARTITE'};let order=['standings','scorers','played','next'];$('teamActions').innerHTML=`<button class="action ${teamTab==='staff'?'active':''}" onclick="selectTeamTab('staff')">STAFF</button>`+order.filter(k=>a[k]).map(k=>`<button class="action ${teamTab===k?'active':''}" onclick="selectTeamTab('${k}')">${labels[k]}</button>`).join('')}
async function selectTeamTab(tab,restoring=false){teamTab=tab;currentView={type:'team',key:currentTeam.key,comp:currentCompetition,tab};await refreshAvailability();let box=$('dynamic');if(tab==='staff'){box.innerHTML=`<div class="section"><h3>STAFF</h3>${staffHTML(currentTeam)}</div>`;return}loading(true);try{if(tab==='standings'){let d=await getJSON(`/api/team/${currentTeam.key}/standings?competition=${currentCompetition}`);box.innerHTML=`<div class="section"><h3>CLASSIFICA · ${currentCompetition}</h3><table><thead><tr><th>POS</th><th>SQUADRA</th><th>G</th><th>V</th><th>N</th><th>P</th><th>PT</th></tr></thead><tbody>${(d.standings||[]).map(x=>`<tr class="${String(x.team).toUpperCase().includes('USSA')?'us':''}"><td>${x.position??''}</td><td><b>${esc(x.team)}</b></td><td>${x.played??''}</td><td>${x.wins??''}</td><td>${x.draws??''}</td><td>${x.losses??''}</td><td><b>${x.points??''}</b></td></tr>`).join('')}</tbody></table></div>`}else if(tab==='scorers'){let d=await getJSON(`/api/team/${currentTeam.key}/players?competition=${currentCompetition}`);box.innerHTML=`<div class="section"><h3>MARCATORI · ${currentCompetition}</h3><table><thead><tr><th>POS</th><th>GIOCATORE</th><th>GOL</th></tr></thead><tbody>${(d.players||[]).map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.name)}</b></td><td><b>${x.goals}</b></td></tr>`).join('')}</tbody></table></div>`}else{let ep=tab==='played'?'matches':'next',d=await getJSON(`/api/team/${currentTeam.key}/${ep}?competition=${currentCompetition}`),played=tab==='played';box.innerHTML=(d.matches||[]).map(x=>matchCard(x,played)).join('')||'<div class="section"><div class="empty">Nessun dato disponibile.</div></div>'}}catch(e){box.innerHTML='<div class="section"><div class="empty">Dati momentaneamente non disponibili.</div></div>'}finally{loading(false)}}
function matchCard(x,played){let title=x.home&&x.away?`${x.home} – ${x.away}`:(x.names?.length?x.names.slice(-2).join(' – '):x.raw||'Partita USSA');let click=x.id?`openFixtureDetail('${x.id}')`:(x.detail_url?`openCsiDetail(${JSON.stringify(x.detail_url)})`:``);return `<div class="matchcard" ${click?`onclick='${click}'`:''}><div class="matchhead"><div><div class="matchdate">${fmtDate(x.date).long.toUpperCase()} · ${esc(x.time||'')}</div><div class="matchtitle">${esc(title)}</div><div class="small">${esc(x.field||x.competition||currentCompetition)}${x.address?' · '+esc(x.address):''}</div></div>${x.home_away?`<div class="pill">${esc(x.home_away)}</div>`:''}</div>${click?`<div class="detailhint">${played?'DETTAGLIO GARA':'INFO PARTITA'} ›</div>`:''}</div>`}
function openAppointment(x){if(x.kind==='EVENTO')navigate({type:'event',item:x});else if(x.id)navigate({type:'fixture',id:x.id})}
function openFixtureDetail(id){navigate({type:'fixture',id})}
function clubVisual(name){let c=CLUBS[String(name).toUpperCase()]||{};let isUSSA=String(name).toUpperCase().includes('USSA');if(c.logo){let sty=c.crop?'object-fit:cover;object-position:74% 23%;transform:scale(2.55);':'';return `<div class="club-logo-wrap"><img class="club-logo" src="${c.logo}" alt="${esc(name)}" style="${sty}" onerror="this.parentElement.innerHTML='<div class=&quot;club-fallback&quot;>${esc(c.abbr||initials(name))}</div>'"></div>`}return `<div class="club-logo-wrap"><div class="club-fallback">${esc(c.abbr||initials(name))}</div></div>`}
async function renderFixtureView(v){loading(true);try{let x=await getJSON(`/api/fixture/${v.id}`),home=x.home_away==='CASA',f=fmtDate(x.date);showOverlay('PARTITA',`<div class="fixture-layout2"><section class="fixture-stage"><div class="fixture-stage-top"><span>UNDER 14</span><span>·</span><span>${esc(x.competition)}</span><span>·</span><span>GIORNATA ${x.round}</span></div><div class="fixture-clubs"><div class="club-side ${String(x.home).includes('USSA')?'club-us':''}">${clubVisual(x.home)}<div class="club-name">${esc(x.home)}</div></div><div class="vsmark">VS</div><div class="club-side ${String(x.away).includes('USSA')?'club-us':''}">${clubVisual(x.away)}<div class="club-name">${esc(x.away)}</div></div></div><div class="fixture-when2"><div class="datehero"><div class="label">DATA</div><strong>${f.long.toUpperCase()}</strong></div><div class="timehero"><div class="label">ORA</div><strong>${esc(x.time)}</strong></div></div><div class="statusbar"><span class="statuspill hot">${esc(x.home_away)}</span><span class="statuspill">${esc(x.leg)}</span></div></section><section class="fixture-grid2"><div class="glass"><h3>DOVE SI GIOCA</h3><div class="venuebig">${esc(x.field)}</div><div class="addrbig">${esc(x.address)}</div><button class="map-cta" onclick="openFixtureMap('${x.id}')">MAPPA E PERCORSO</button></div><div class="glass"><h3>${home?'IMPIANTO':'PERCORSO DA USSA STADIUM'}</h3><div id="routeSummary">${home?'<div class="route-number"><strong>USSA STADIUM</strong></div><div class="route-note">Via Cooperazione, Rozzano</div>':'<div class="route-number"><strong>CALCOLO…</strong></div><div class="route-note">Distanza e tempo indicativo</div>'}</div></div></section><section class="fixture-qr-grid">${home?'':`<div class="qrpanel"><img alt="QR percorso" src="/api/qr/route/${x.id}.svg"><div><h3>PERCORSO SUL TELEFONO</h3><p>Scansiona per aprire la navigazione da USSA Stadium al campo della gara.</p></div></div>`}<div class="qrpanel"><img alt="QR calendario" src="/api/qr/calendar/${x.id}.svg"><div><h3>AGGIUNGI AL CALENDARIO</h3><p>Scansiona per salvare partita, data, ora, campo e indirizzo sul telefono.</p></div></div></section><section class="route-map-card"><div class="route-map-head"><b>${home?'MAPPA USSA STADIUM':'ANTEPRIMA PERCORSO'}</b><span>${home?'campo di casa':'USSA Stadium → campo gara'}</span></div><div id="routeMap" class="route-map"><div class="map-status">Caricamento mappa…</div></div></section></div>`);await initRouteMap(x,'routeMap');if(!home){try{let r=await getJSON(`/api/route?address=${encodeURIComponent(x.route_address||x.address)}`);let el=$('routeSummary');if(el)el.innerHTML=`<div class="route-number"><strong>${r.km} km</strong> · ${r.minutes} min</div><div class="route-note">Partenza: USSA Stadium</div>`}catch{let el=$('routeSummary');if(el)el.innerHTML='<div class="route-number"><strong>PERCORSO</strong></div><div class="route-note">Mappa e QR disponibili; distanza temporaneamente non calcolabile.</div>'}}}catch(e){showOverlay('PARTITA','<div class="section"><div class="empty">Partita momentaneamente non disponibile.</div></div>')}finally{loading(false)}}
async function initRouteMap(x,containerId){let el=$(containerId);if(!el)return;let addr=x.route_address||x.address;if(typeof L==='undefined'){el.innerHTML=`<iframe src="https://www.google.com/maps?q=${encodeURIComponent(addr)}&output=embed"></iframe>`;return}try{let m=L.map(containerId,{zoomControl:true,attributionControl:true});activeMap=m;L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);if(x.home_away==='CASA'){let d=await getJSON(`/api/geocode?address=${encodeURIComponent(addr)}`);L.marker([d.lat,d.lon]).addTo(m).bindPopup('USSA Stadium');m.setView([d.lat,d.lon],15)}else{let r=await getJSON(`/api/route?address=${encodeURIComponent(addr)}`);let pts=(r.geometry||[]).map(p=>[p[1],p[0]]);if(pts.length){let line=L.polyline(pts,{weight:6}).addTo(m);L.marker([r.origin.lat,r.origin.lon]).addTo(m).bindPopup('USSA Stadium');L.marker([r.destination.lat,r.destination.lon]).addTo(m).bindPopup(x.field);m.fitBounds(line.getBounds(),{padding:[28,28]})}else m.setView([r.destination.lat,r.destination.lon],14)}let st=el.querySelector('.map-status');if(st)st.remove()}catch(e){el.innerHTML=`<iframe src="https://www.google.com/maps?q=${encodeURIComponent(addr)}&output=embed"></iframe><div class="map-status">Percorso completo non disponibile: visualizzato il campo di arrivo.</div>`}}
function openFixtureMap(id){navigate({type:'map',id})}
async function renderMapView(v){loading(true);try{let x=await getJSON(`/api/fixture/${v.id}`);showOverlay('CAMPO E MAPPA',`<div class="fullmap-layout2"><div class="fullmap-info2"><h2>${esc(x.field)}</h2><p>${esc(x.address)}${x.home_away==='TRASFERTA'?' · partenza: USSA Stadium':''}</p></div><div id="fullRouteMap" class="fullroute-map"><div class="map-status">Caricamento percorso…</div></div></div>`);await initRouteMap(x,'fullRouteMap')}catch{showOverlay('CAMPO E MAPPA','<div class="section"><div class="empty">Mappa momentaneamente non disponibile.</div></div>')}finally{loading(false)}}
function openCsiDetail(url){navigate({type:'csi',url})}
async function renderCsiView(v){loading(true);try{let d=await getJSON(`/api/game-detail?url=${encodeURIComponent(v.url)}`);showOverlay('DETTAGLIO GARA',`<div class="hero"><h1>${esc(d.score||'PARTITA')}</h1><p>${esc(d.title||'')}</p></div>${d.field?`<div class="section"><h3>CAMPO</h3>${esc(d.field)}</div>`:''}<div class="section"><h3>CRONOLOGIA</h3>${(d.events||[]).length?d.events.map(x=>`<div class="matchcard">${esc(x)}</div>`).join(''):'<div class="empty">Nessun evento di cronaca pubblicato.</div>'}</div>`)}catch{showOverlay('DETTAGLIO GARA','<div class="section"><div class="empty">Dettaglio CSI momentaneamente non disponibile.</div></div>')}finally{loading(false)}}
function openNowTeam(){let x=nowItems[nowIdx];if(x?.team_key)openTeam(x.team_key)}
function openInfo(){navigate({type:'info'})}function renderInfoView(){let sec=hub.secretariat||{};showOverlay('INFO',`<div class="info-menu"><div class="infocard"><h3>SEGRETERIA</h3><div class="kv"><div class="kvrow"><b>Orari</b><span>${esc(sec.label||'')} · ${esc(sec.open||'')}–${esc(sec.close||'')}</span></div></div></div><div class="infocard"><h3>SOCIAL & CONTATTI</h3><div class="empty">Area predisposta per contatti, social e QR.</div></div><div class="infocard"><h3>DIRIGENZA</h3><div class="empty">Area predisposta.</div></div><div class="infocard"><h3>PARTNER & SPONSOR</h3><div class="empty">Area predisposta.</div></div></div>`)}
function renderEventView(x){showOverlay('EVENTO',`<div class="hero"><h1>${esc(x.title)}</h1><p>${fmtDate(x.date).long} · ${esc(x.time||'')}</p></div><div class="section">${esc(x.description||'Evento USSA')}</div>`)}
function resetIdle(){clearTimeout(idleTimer);$('idle').classList.remove('show');idleTimer=setTimeout(()=>$('idle').classList.add('show'),(hub.idle_seconds||90)*1000)}function wake(){$('idle').classList.remove('show');resetIdle()}['click','touchstart','mousemove','keydown'].forEach(e=>document.addEventListener(e,resetIdle,{passive:true}));boot().catch(console.error);
</script></body></html>
