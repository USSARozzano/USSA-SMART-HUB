<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>USSA SMART HUB</title>
<style>
:root {
  --navy:#071a2d;
  --navy2:#0b253d;
  --navy3:#102e4a;
  --yellow:#ffca1a;
  --white:#f7f9fb;
  --muted:#9fb0c1;
  --line:#31506b;
  --shadow: 0 10px 30px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;background:#020a12;color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
button{font:inherit}
.app{min-height:100vh;background:
radial-gradient(circle at 75% 10%,rgba(17,63,96,.25),transparent 35%),
linear-gradient(180deg,#04111d 0%,#071a2d 100%);padding:18px}
.header{display:grid;grid-template-columns:280px 1fr 180px;align-items:center;gap:18px;margin-bottom:14px}
.clockbox{border:1px solid var(--line);border-radius:18px;padding:12px 16px;background:rgba(3,14,24,.55);box-shadow:var(--shadow)}
.clock{font-weight:900;font-size:38px;line-height:1}
.date{font-size:15px;color:var(--yellow);font-weight:800;margin-top:6px}
.title{text-align:center;font-size:48px;font-weight:950;letter-spacing:.5px}
.title .y{color:var(--yellow)}
.logo-wrap{display:flex;justify-content:flex-end}
.logo{width:118px;height:118px;object-fit:contain;filter:drop-shadow(0 5px 12px rgba(0,0,0,.25))}
.main{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:calc(100vh - 160px)}
.panel{border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(10,37,61,.98),rgba(6,27,46,.98));box-shadow:var(--shadow);overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:17px 20px 12px;border-bottom:1px solid rgba(49,80,107,.55)}
.panel-title{font-size:24px;font-weight:900;color:var(--yellow)}
.panel-sub{font-size:13px;color:var(--muted)}
.schedule{padding:12px 14px 18px;display:flex;flex-direction:column;gap:9px;max-height:calc(100vh - 235px);overflow:auto}
.game{display:grid;grid-template-columns:110px 1fr 125px;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(7,26,45,.7)}
.when .day{font-size:14px;font-weight:850}
.when .time{font-size:27px;font-weight:950;color:var(--yellow)}
.sport{font-size:11px;color:var(--yellow);font-weight:950;letter-spacing:.4px}
.match{font-size:15px;font-weight:900;line-height:1.25;margin-top:3px}
.place{text-align:right;color:#d2dbe4;font-size:12px}
.small-note{padding:0 18px 14px;text-align:center;color:var(--muted);font-size:12px}
.right-content{padding:16px}
.team-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.team-btn{min-height:82px;border:1px solid #b98500;border-radius:14px;background:linear-gradient(180deg,#102f4c,#0a2138);color:white;padding:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;transition:.15s transform,.15s background}
.team-btn:active{transform:scale(.98)}
.team-btn .ico{font-size:23px}
.team-btn .name{font-size:13px;font-weight:950;text-align:center;line-height:1.15}
.team-btn:hover{background:linear-gradient(180deg,#173c60,#0c2945)}
.team-btn.featured{background:linear-gradient(180deg,#ffd52b,#f4b900);color:#06111c;border-color:#ffd52b}
.detail{display:none}
.detail.show{display:block}
.team-grid.hide{display:none}
.detail-hero{text-align:center;padding:10px 0 22px}
.detail-ico{font-size:52px}
.detail-type{font-size:16px;color:#c7d2dc;font-weight:800}
.detail-name{font-size:34px;color:var(--yellow);font-weight:950}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.action{min-height:118px;border:1px solid var(--line);border-radius:15px;background:#0a2239;color:white;padding:18px;cursor:pointer;text-align:left}
.action strong{display:block;font-size:22px;margin-bottom:8px}
.action span{font-size:13px;color:var(--muted)}
.action.primary{background:linear-gradient(180deg,#ffd32a,#f1b800);color:#08131e;border-color:#ffd32a}
.action.primary span{color:#3d3200}
.back{margin-top:18px;width:100%;padding:15px 18px;border:1px solid var(--line);border-radius:14px;background:#0a2239;color:white;font-weight:900;cursor:pointer}
.data-view{display:none;padding:4px 0 0}
.data-view.show{display:block}
.view-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.mini-back{border:1px solid var(--line);background:#0a2239;color:white;border-radius:10px;padding:10px 12px;font-weight:850;cursor:pointer}
.view-title{font-size:26px;font-weight:950;color:var(--yellow)}
table{width:100%;border-collapse:collapse;font-size:14px;overflow:hidden;border-radius:12px}
th{text-align:left;background:#061725;color:#dce5ed;padding:10px;border-bottom:1px solid var(--line);font-size:11px}
td{padding:10px;border-bottom:1px solid rgba(49,80,107,.6)}
tr.us td{background:var(--yellow);color:#07111b;font-weight:950}
.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:rgba(255,202,26,.14);color:var(--yellow);font-size:11px;font-weight:900}
@media(max-width:900px){
  .app{padding:10px}
  .header{grid-template-columns:1fr auto;grid-template-areas:"clock logo" "title title";gap:8px}
  .clockbox{grid-area:clock;padding:10px 12px}
  .clock{font-size:30px}
  .date{font-size:12px}
  .title{grid-area:title;font-size:34px;text-align:left;padding:6px 2px}
  .logo-wrap{grid-area:logo}
  .logo{width:84px;height:84px}
  .main{grid-template-columns:1fr;min-height:auto}
  .schedule{max-height:none}
  .team-grid{grid-template-columns:repeat(2,1fr)}
  .game{grid-template-columns:86px 1fr 80px;gap:8px}
  .when .time{font-size:22px}
  .place{font-size:10px}
  .action-grid{grid-template-columns:1fr}
}
</style>
</head>

function tick(){
  const d=new Date();
  document.getElementById("clock").textContent=d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  const weekday=d.toLocaleDateString("it-IT",{weekday:"long"});
  const rest=d.toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"});
  document.getElementById("date").innerHTML=weekday.charAt(0).toUpperCase()+weekday.slice(1)+"<br>"+rest;
}

// ===== USSA SMART HUB · LIVE API =====
// Se la pagina è servita dal backend incluso nel pacchetto, prova a caricare
// automaticamente il calendario CSI. Se aperta come semplice file HTML,
// resta utilizzabile con il calendario demo concordato.
async function tryLoadLiveCalendar(){
  if(location.protocol === "file:") return;
  try{
    const r = await fetch("/api/upcoming", {cache:"no-store"});
    if(!r.ok) return;
    const data = await r.json();
    if(!Array.isArray(data) || data.length===0) return;
    scheduleEl.innerHTML="";
    data.forEach(g=>{
      const el=document.createElement("div"); el.className="game";
      el.innerHTML=`<div class="when"><div class="day">${g.day_label||""}</div><div class="time">${g.time||""}</div></div>
      <div><div class="sport">${g.category||"GARA CSI"}</div><div class="match">${g.home||""}<br>vs ${g.away||""}</div></div>
      <div class="place">📍 ${g.venue||""}</div>`;
      scheduleEl.appendChild(el);
    });
  }catch(e){}
}
tryLoadLiveCalendar();
