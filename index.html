<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061827">
<title>USSA SMART HUB · V2</title>
<style>
:root{
 --navy:#061827;--navy2:#071d31;--card:#0b2943;--card2:#0d3454;
 --yellow:#ffca18;--white:#f7f9fb;--muted:#a8b9c9;--line:#2a506c;
 --green:#35d07f;--red:#ff6d6d;--shadow:0 10px 30px rgba(0,0,0,.17)
}
*{box-sizing:border-box}html,body{margin:0;background:var(--navy);color:var(--white);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100vh;overflow:hidden}.app{width:min(100vw,1080px);height:100vh;margin:auto;padding:18px;background:linear-gradient(180deg,#071b2e,#061827)}
button{font:inherit}.header{height:116px;display:grid;grid-template-columns:90px 1fr auto;align-items:center;gap:16px;border-bottom:1px solid var(--line);margin-bottom:14px}
.logo{width:80px;height:80px;object-fit:contain}.brand{font-size:38px;font-weight:950;white-space:nowrap}.brand b{color:var(--yellow)}
.datetime{text-align:right}.clock{font-size:35px;font-weight:950;line-height:1}.date{margin-top:7px;color:var(--yellow);font-weight:900;font-size:14px}
.home{height:calc(100vh - 148px);display:grid;grid-template-rows:29% 15% 1fr;gap:12px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.head{height:56px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(42,80,108,.72)}
.head h2{margin:0;color:var(--yellow);font-size:22px;letter-spacing:.2px}.sourcehint{font-size:11px;color:var(--muted)}
.schedule{height:calc(100% - 56px);overflow-y:auto;overscroll-behavior:contain;padding:5px 14px 14px;scrollbar-width:thin}
.appointment{width:100%;display:grid;grid-template-columns:92px 1fr 30px;gap:12px;align-items:center;text-align:left;border:0;border-bottom:1px solid rgba(42,80,108,.7);background:transparent;color:white;padding:11px 4px;cursor:pointer}
.appointment:last-child{border-bottom:0}.a-date{font-size:11px;font-weight:900;color:var(--muted)}.a-time{font-size:23px;color:var(--yellow);font-weight:950}
.a-kind{font-size:10px;color:var(--yellow);font-weight:950}.a-title{font-size:15px;font-weight:950;margin-top:2px}.a-meta{font-size:11px;color:var(--muted);margin-top:3px}.chev{font-size:25px;color:var(--muted)}
.middle{display:grid;grid-template-columns:1.55fr .75fr;gap:12px}.now,.info{height:100%;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,var(--card2),var(--card));color:white;box-shadow:var(--shadow)}
.now{padding:18px 20px;position:relative;text-align:left}.eyebrow{font-size:12px;font-weight:950;color:var(--yellow)}.now-title{font-size:28px;font-weight:950;margin-top:9px;line-height:1.05}
.now-meta{font-size:13px;color:var(--muted);margin-top:6px}.dots{position:absolute;right:18px;bottom:13px;color:var(--muted);letter-spacing:4px}
.info{display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}.info-icon{font-size:44px;font-weight:300;line-height:1}.info-label{font-size:17px;font-weight:950;margin-top:5px}
.open{margin-top:9px;font-size:11px;font-weight:950;color:var(--green);text-align:center;display:none}.open.show{display:block}
.teams{display:flex;flex-direction:column;min-height:0}.team-grid{padding:12px 14px 14px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,minmax(0,1fr));gap:9px;height:calc(100% - 56px);min-height:0}
.team{border:1px solid #7f6a18;border-radius:14px;background:#09233a;color:white;padding:8px 7px;cursor:pointer;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.team:hover{border-color:var(--yellow)}.team .icon{font-size:18px}.team .name{font-size:13px;font-weight:950;line-height:1.05;margin-top:3px}.team .sport{font-size:8px;color:var(--muted);font-weight:850;margin-top:3px}
.empty{color:var(--muted);font-size:14px;padding:18px}.overlay{position:fixed;inset:0;background:var(--navy);z-index:20;display:none;overflow:auto}.overlay.show{display:block}
.screen{width:min(100vw,1080px);min-height:100vh;margin:auto;padding:18px;background:linear-gradient(180deg,#071b2e,#061827)}
.screenbar{height:76px;display:grid;grid-template-columns:76px 1fr 76px;align-items:center;border-bottom:1px solid var(--line);margin-bottom:16px;position:sticky;top:0;background:#071b2e;z-index:4}
.backbtn{border:1px solid var(--line);border-radius:13px;background:var(--card);color:white;padding:12px;cursor:pointer}.screentitle{text-align:center;color:var(--yellow);font-size:24px;font-weight:950}
.hero,.section{border:1px solid var(--line);border-radius:19px;background:var(--card);padding:19px;margin-bottom:12px}.hero h1{margin:0;color:var(--yellow);font-size:35px}.hero p{margin:6px 0 0;color:var(--muted);font-weight:850}
.profilegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.section h3{margin:0 0 11px;color:var(--yellow);font-size:16px}.kv{display:grid;gap:8px}.kvrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}.kvrow:last-child{border-bottom:0}.kvrow span{color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:11px}.action{min-height:96px;border:1px solid var(--line);border-radius:16px;background:var(--card2);color:white;font-weight:950;font-size:17px;cursor:pointer;padding:10px}.action.wide{grid-column:1/-1}.action.disabled{opacity:.4}
.loading{position:fixed;inset:0;z-index:50;background:rgba(3,13,22,.91);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}.loading.show{display:flex}
.spinner{width:50px;height:50px;border:4px solid #294964;border-top-color:var(--yellow);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.loading strong{font-size:18px}
table{width:100%;border-collapse:collapse;font-size:14px}th{position:sticky;top:76px;background:#071a2c;color:var(--yellow);padding:11px 7px;text-align:left;z-index:2}td{padding:11px 7px;border-bottom:1px solid var(--line)}tr.us td{background:var(--yellow);color:#07131d;font-weight:950}
.matchcard,.personcard,.infocard{border:1px solid var(--line);border-radius:15px;background:var(--card);padding:15px;margin-bottom:9px}.matchtop{display:flex;justify-content:space-between;gap:15px}.matchdate{color:var(--yellow);font-weight:950}.matchtitle{font-size:18px;font-weight:950;margin-top:7px}.small{font-size:12px;color:var(--muted);margin-top:5px}
.detailbtn{margin-top:11px;border:1px solid var(--line);border-radius:11px;background:var(--card2);color:white;padding:9px 12px;font-weight:900;cursor:pointer}
.rostergrid,.leadershipgrid,.sponsorgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.personcard{text-align:center;margin:0}.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#173c59;margin:auto}.personname{font-weight:950;margin-top:8px}.personrole{font-size:11px;color:var(--muted);margin-top:3px}
.info-menu{display:grid;gap:12px}.infocard h3{margin:0 0 9px;color:var(--yellow)}.contactbuttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.contactbtn{border:1px solid var(--line);border-radius:13px;background:var(--card2);color:white;padding:13px;font-weight:900}
.mapbox{border:1px solid var(--line);border-radius:16px;overflow:hidden;height:360px;background:#0a2339}.mapbox iframe{width:100%;height:100%;border:0}
.timeline{display:grid;gap:8px}.eventline{border-left:3px solid var(--yellow);padding:9px 12px;background:var(--card);border-radius:0 12px 12px 0}
.idle{position:fixed;inset:0;background:radial-gradient(circle at center,#0d3351,#061827 68%);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column}.idle.show{display:flex}.idle img{width:min(54vw,440px);opacity:.24}.idle strong{margin-top:30px;color:var(--yellow);font-size:22px;letter-spacing:2px;animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}
@media(max-width:700px){
 body{overflow:auto}.app{height:auto;min-height:100vh;padding:10px}.header{height:110px;grid-template-columns:76px 1fr auto}.logo{width:66px;height:66px}.brand{font-size:25px;white-space:normal}.clock{font-size:28px}.date{font-size:11px}
 .home{height:auto;display:block}.home>section,.middle{margin-bottom:12px}.card:first-child{height:395px}.middle{height:205px;grid-template-columns:1.45fr .8fr}.teams{height:auto}.team-grid{height:auto;grid-template-columns:repeat(3,1fr);grid-template-rows:none}.team{min-height:82px}
 .profilegrid{grid-template-columns:1fr}.rostergrid,.leadershipgrid,.sponsorgrid{grid-template-columns:repeat(2,1fr)}.screentitle{font-size:19px}
}
</style></head>
<body>
<div class="app">
<header class="header">
 <img class="logo" src="/assets/ussa-logo.png" alt="USSA Rozzano">
 <div class="brand">USSA <b>SMART HUB</b></div>
 <div class="datetime"><div id="clock" class="clock">--:--</div><div id="date" class="date"></div></div>
</header>
<main class="home">
 <section class="card">
  <div class="head"><h2>PROSSIMI APPUNTAMENTI</h2></div>
  <div id="schedule" class="schedule"><div class="empty">Caricamento…</div></div>
 </section>
 <section class="middle">
  <button id="now" class="now" onclick="openNowTeam()"><div class="eyebrow">ORA IN CAMPO</div><div id="nowTitle" class="now-title">Nessuna attività in corso</div><div id="nowMeta" class="now-meta"></div><div id="dots" class="dots"></div></button>
  <button class="info" onclick="openInfo()"><div class="info-icon">ⓘ</div><div class="info-label">INFO</div><div id="secretaryOpen" class="open">● SEGRETERIA APERTA ORA</div></button>
 </section>
 <section class="card teams">
  <div class="head"><h2>LE NOSTRE SQUADRE</h2><span class="sourcehint">fino a 20 squadre</span></div>
  <div id="teams" class="team-grid"></div>
 </section>
</main>
</div>
<div id="overlay" class="overlay"><div class="screen"><div class="screenbar"><button class="backbtn" onclick="closeOverlay()">←</button><div id="screenTitle" class="screentitle"></div><div></div></div><div id="screenBody"></div></div></div>
<div id="loading" class="loading"><div class="spinner"></div><strong>Caricamento…</strong></div>
<div id="idle" class="idle" onclick="wake()"><img src="/assets/ussa-logo.png"><strong>TOCCA LO SCHERMO</strong></div>

<script>
let teams=[],hub={},currentTeam=null,nowItems=[],nowIndex=0,nowTimer=null,idleTimer;
const $=id=>document.getElementById(id);
const esc=s=>(s??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function sportIcon(s){return s.includes('VOLLEY')?'🏐':s.includes('BASKET')?'🏀':'⚽'}
function loading(v){$('loading').classList.toggle('show',v)}
async function getJSON(u){let r=await fetch(u,{cache:'no-store'});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Dati momentaneamente non disponibili');return d}
function tick(){const n=new Date();$('clock').textContent=n.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});$('date').textContent=n.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'}).toUpperCase();updateSecretary(n)}
setInterval(tick,1000);tick();
function updateSecretary(n){if(!hub.secretariat)return;let day=n.getDay()||7,m=n.getHours()*60+n.getMinutes(),[oh,om]=hub.secretariat.open.split(':').map(Number),[ch,cm]=hub.secretariat.close.split(':').map(Number);$('secretaryOpen').classList.toggle('show',hub.secretariat.days.includes(day)&&m>=oh*60+om&&m<ch*60+cm)}
async function boot(){[teams,hub]=await Promise.all([getJSON('/api/teams'),getJSON('/api/hub')]);renderTeams();await Promise.allSettled([loadSchedule(),loadNow()]);resetIdle()}
function renderTeams(){let visible=teams.filter(t=>t.visible!==false).slice(0,20);$('teams').innerHTML=visible.map(t=>`<button class="team" onclick="openTeam('${t.key}')"><div class="icon">${sportIcon(t.sport)}</div><div class="name">${esc(t.label)}</div><div class="sport">${esc(t.sport)}</div></button>`).join('')}
async function loadSchedule(){try{let d=await getJSON('/api/home/upcoming');if(!d.items.length){$('schedule').innerHTML='<div class="empty">Nessun prossimo appuntamento disponibile.</div>';return}$('schedule').innerHTML=d.items.map((x,i)=>`<button class="appointment" onclick='openAppointment(${JSON.stringify(x).replace(/'/g,"&#39;")})'><div><div class="a-date">${new Date(x.date+"T00:00:00").toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"}).toUpperCase()}</div><div class="a-time">${esc(x.time||"")}</div></div><div><div class="a-kind">${esc(x.kind||"")}</div><div class="a-title">${esc(x.title||"")}</div><div class="a-meta">${esc(x.meta||"")}${x.field?` · ${esc(x.field)}`:""}</div></div><div class="chev">›</div></button>`).join('')}catch(e){$('schedule').innerHTML='<div class="empty">Appuntamenti momentaneamente non disponibili.</div>'}}
async function loadNow(){try{let d=await getJSON('/api/home/now');nowItems=d.items||[];nowIndex=0;showNow();clearInterval(nowTimer);if(nowItems.length>1)nowTimer=setInterval(()=>{nowIndex=(nowIndex+1)%nowItems.length;showNow()},5500)}catch{nowItems=[];showNow()}}
function showNow(){if(!nowItems.length){$('nowTitle').textContent='Nessuna attività in corso';$('nowMeta').textContent='';$('dots').textContent='';return}let x=nowItems[nowIndex];$('nowTitle').textContent=x.title;$('nowMeta').textContent=`${x.kind} · ${x.meta||''}${x.place?' · '+x.place:''}`;$('dots').textContent=nowItems.map((_,i)=>i===nowIndex?'●':'○').join(' ')}
function openNowTeam(){let x=nowItems[nowIndex];if(x?.team_key)openTeam(x.team_key)}
function showScreen(title,html){$('screenTitle').textContent=title;$('screenBody').innerHTML=html;$('overlay').classList.add('show');window.scrollTo(0,0);resetIdle()}
function closeOverlay(){$('overlay').classList.remove('show');resetIdle()}
function findTeam(k){return teams.find(t=>t.key===k)}
function trainingHTML(t){let a=t.training||[];if(!a.length)return '<div class="empty">Dati allenamenti da inserire nel database USSA.</div>';return `<div class="kv">${a.map(x=>`<div class="kvrow"><b>${esc(x.day||'')}</b><span>${esc(x.start||'')}–${esc(x.end||'')} · ${esc(x.place||'')}</span></div>`).join('')}</div>`}
function staffHTML(t){let a=t.staff||[];if(!a.length)return '<div class="empty">Staff da inserire nel database USSA.</div>';return `<div class="kv">${a.map(x=>`<div class="kvrow"><b>${esc(x.name)}</b><span>${esc(x.role)}</span></div>`).join('')}</div>`}
function openTeam(k){let t=findTeam(k);if(!t)return;currentTeam=t;showScreen(t.label,`<div class="hero"><h1>${esc(t.label)}</h1><p>${esc(t.sport)}</p></div><div class="profilegrid"><div class="section"><h3>ALLENAMENTI</h3>${trainingHTML(t)}</div><div class="section"><h3>STAFF</h3>${staffHTML(t)}</div></div><div class="section"><h3>CONSULTA</h3><div class="actions"><button class="action ${t.classifica?'':'disabled'}" ${t.classifica?`onclick="openStandings()"`:'disabled'}>CLASSIFICA</button><button class="action ${t.marcatori?'':'disabled'}" ${t.marcatori?`onclick="openScorers()"`:'disabled'}>MARCATORI</button><button class="action" onclick="openPlayed()">GARE DISPUTATE</button><button class="action" onclick="openNext()">PROSSIME PARTITE</button><button class="action wide" onclick="openRoster()">ROSA & STAFF</button></div></div>`)}
async function openStandings(){loading(true);try{let d=await getJSON(`/api/team/${currentTeam.key}/standings`);if(!d.available){showScreen('CLASSIFICA','<div class="section">Questa categoria non prevede classifica.</div>');return}let rows=d.standings||[];let h=`<div class="section"><table><thead><tr><th>POS</th><th>SQUADRA</th><th>G</th><th>V</th><th>N</th><th>P</th><th>PT</th></tr></thead><tbody>${rows.map(x=>`<tr class="${(x.team||'').toUpperCase().includes('USSA')?'us':''}"><td>${x.position??''}</td><td><b>${esc(x.team)}</b></td><td>${x.played??''}</td><td>${x.wins??''}</td><td>${x.draws??''}</td><td>${x.losses??''}</td><td><b>${x.points??''}</b></td></tr>`).join('')}</tbody></table></div>`;showScreen(`${currentTeam.label} · CLASSIFICA`,h)}catch(e){showScreen('CLASSIFICA',`<div class="section">${esc(e.message)}</div>`)}finally{loading(false)}}
async function openScorers(){loading(true);try{let d=await getJSON(`/api/team/${currentTeam.key}/players`);if(!d.available){showScreen('MARCATORI','<div class="section">Marcatori non previsti per questa categoria.</div>');return}let a=d.players||[];showScreen(`${currentTeam.label} · MARCATORI`,`<div class="section">${a.length?`<table><thead><tr><th>POS</th><th>GIOCATORE</th><th>GOL</th></tr></thead><tbody>${a.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.name)}</b></td><td><b>${x.goals}</b></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nessun marcatore disponibile.</div>'}</div>`)}catch(e){showScreen('MARCATORI',`<div class="section">${esc(e.message)}</div>`)}finally{loading(false)}}
function matchCard(x,played){return `<div class="matchcard"><div class="matchtop"><div><div class="matchdate">${esc(x.date||'')} · ${esc(x.time||'')}</div><div class="matchtitle">${esc((x.names&&x.names.length)?x.names.slice(-2).join(' – '):(x.raw||'Partita USSA'))}</div><div class="small">${esc(x.meta||currentTeam.label)}</div></div>${x.result?`<div class="matchdate">${esc(x.result)}</div>`:''}</div>${played&&x.detail_url?`<button class="detailbtn" onclick='openGameDetail(${JSON.stringify(x.detail_url)})'>DETTAGLIO GARA ›</button>`:''}${!played?`<button class="detailbtn" onclick='openVenue(${JSON.stringify(x)})'>CAMPO E MAPPA ›</button>`:''}</div>`}
async function openPlayed(){loading(true);try{let d=await getJSON(`/api/team/${currentTeam.key}/matches`);let a=d.matches||[];showScreen(`${currentTeam.label} · GARE DISPUTATE`,`<div>${a.length?a.map(x=>matchCard(x,true)).join(''):'<div class="section empty">Nessuna gara disputata disponibile.</div>'}</div>`)}catch(e){showScreen('GARE DISPUTATE',`<div class="section">${esc(e.message)}</div>`)}finally{loading(false)}}
async function openNext(){loading(true);try{let d=await getJSON(`/api/team/${currentTeam.key}/next`);let a=d.matches||[];showScreen(`${currentTeam.label} · PROSSIME PARTITE`,`<div>${a.length?a.map(x=>matchCard(x,false)).join(''):'<div class="section empty">Nessuna prossima partita pubblicata.</div>'}</div>`)}catch(e){showScreen('PROSSIME PARTITE',`<div class="section">${esc(e.message)}</div>`)}finally{loading(false)}}
async function openGameDetail(url){loading(true);try{let d=await getJSON(`/api/game-detail?url=${encodeURIComponent(url)}`);showScreen('DETTAGLIO GARA',`<div class="hero"><h1>${esc(d.score||'PARTITA')}</h1><p>${esc(d.title||'')}</p></div>${d.field?`<div class="section"><h3>CAMPO</h3>${esc(d.field)}</div>`:''}<div class="section"><h3>CRONOLOGIA</h3><div class="timeline">${(d.events||[]).length?d.events.map(x=>`<div class="eventline">${esc(x)}</div>`).join(''):'<div class="empty">Nessun evento di cronaca pubblicato.</div>'}</div></div>`)}catch(e){showScreen('DETTAGLIO GARA',`<div class="section">${esc(e.message)}</div>`)}finally{loading(false)}}
async function openRoster(){loading(true);try{let d=await getJSON(`/api/team/${currentTeam.key}/roster`);let a=d.players||[];let roster=a.length?`<div class="rostergrid">${a.map(x=>`<div class="personcard">${x.photo?`<img class="avatar" src="/api/image?url=${encodeURIComponent(x.photo)}">`:`<div class="avatar"></div>`}<div class="personname">${esc(x.name)}</div><div class="personrole">${esc(x.role||'Atleta')}</div></div>`).join('')}</div>`:'<div class="empty">Rosa non ancora disponibile.</div>';showScreen(`${currentTeam.label} · ROSA & STAFF`,`<div class="section"><h3>STAFF</h3>${staffHTML(currentTeam)}</div><div class="section"><h3>ROSA</h3>${roster}</div>`)}catch(e){showScreen('ROSA & STAFF',`<div class="section">${esc(e.message)}</div>`)}finally{loading(false)}}
async function openVenue(x){let addr=x.address||x.field||'';showScreen('CAMPO E MAPPA',`<div class="hero"><h1>${esc(x.field||'Campo di gara')}</h1><p>${esc(addr||'Indirizzo in attesa di pubblicazione')}</p></div><div id="routebox" class="section"><div class="empty">Calcolo percorso da USSA Stadium…</div></div>`);if(!addr)return;try{let r=await getJSON(`/api/route?address=${encodeURIComponent(addr)}`);let dest=r.destination;let bbox=[dest.lon-.015,dest.lat-.01,dest.lon+.015,dest.lat+.01].join(',');$('routebox').innerHTML=`<h3>PERCORSO DA USSA STADIUM</h3><div class="kv"><div class="kvrow"><b>Distanza</b><span>${r.km} km</span></div><div class="kvrow"><b>Tempo stimato</b><span>${r.minutes} min</span></div></div><div class="mapbox" style="margin-top:14px"><iframe src="https://www.openstreetmap.org/export/embed.html?bbox=${encodeURIComponent(bbox)}&layer=mapnik&marker=${dest.lat}%2C${dest.lon}"></iframe></div>`}catch{$('routebox').innerHTML='<div class="empty">Percorso momentaneamente non disponibile.</div>'}}
function openAppointment(x){if(x.kind==='EVENTO')return openEvent(x);let body=`<div class="hero"><h1>${esc(x.title)}</h1><p>${new Date(x.date+"T00:00").toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'})} · ${esc(x.time||'')}</p></div><div class="section"><h3>GARA</h3><div class="kv"><div class="kvrow"><b>Categoria</b><span>${esc(x.meta||'')}</span></div><div class="kvrow"><b>Campo</b><span>${esc(x.field||'Da definire')}</span></div></div>${x.address?`<button class="detailbtn" onclick='openVenue(${JSON.stringify(x)})'>CAMPO E MAPPA ›</button>`:''}</div>`;showScreen('PARTITA',body)}
function openEvent(x){showScreen('EVENTO',`<div class="hero"><h1>${esc(x.title)}</h1><p>${new Date(x.date+"T00:00").toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'})} · ${esc(x.time||'')}</p></div><div class="section"><h3>DETTAGLI</h3><p>${esc(x.description||x.meta||'Evento USSA')}</p>${x.field?`<div class="kvrow"><b>Luogo</b><span>${esc(x.field)}</span></div>`:''}</div>${(x.program||[]).length?`<div class="section"><h3>PROGRAMMA</h3>${x.program.map(p=>`<div class="kvrow"><b>${esc(p.time)}</b><span>${esc(p.label)}</span></div>`).join('')}</div>`:''}`)}
function openInfo(){let c=hub.contacts||{},sec=hub.secretariat||{},lead=hub.leadership||[],sp=hub.sponsors||[];showScreen('INFO',`<div class="info-menu"><div class="infocard"><h3>SEGRETERIA & CONTATTI</h3><div class="kv"><div class="kvrow"><b>Segreteria</b><span>${esc(sec.label||'')} · ${esc(sec.open||'')}–${esc(sec.close||'')}</span></div>${c.email?`<div class="kvrow"><b>Email</b><span>${esc(c.email)}</span></div>`:''}${c.phone?`<div class="kvrow"><b>Telefono</b><span>${esc(c.phone)}</span></div>`:''}</div></div><div class="infocard"><h3>SOCIAL</h3><div class="contactbuttons">${['website','instagram','facebook','whatsapp'].filter(k=>c[k]).map(k=>`<div class="contactbtn">${k.toUpperCase()}</div>`).join('')||'<div class="empty">Contatti social da inserire nel backend.</div>'}</div></div><div class="infocard"><h3>DIRIGENZA</h3>${lead.length?`<div class="leadershipgrid">${lead.map(x=>`<div class="personcard">${x.photo?`<img class="avatar" src="${esc(x.photo)}">`:`<div class="avatar"></div>`}<div class="personname">${esc(x.name)}</div><div class="personrole">${esc(x.role)}</div></div>`).join('')}</div>`:'<div class="empty">Dirigenza da inserire nel backend.</div>'}</div><div class="infocard"><h3>PARTNER & SPONSOR</h3>${sp.length?`<div class="sponsorgrid">${sp.map(x=>`<div class="personcard"><div class="personname">${esc(x.name)}</div><div class="personrole">${esc(x.contact||'')}</div></div>`).join('')}</div>`:'<div class="empty">Sponsor e partner da inserire nel backend.</div>'}</div></div>`)}
function resetIdle(){clearTimeout(idleTimer);$('idle').classList.remove('show');idleTimer=setTimeout(()=>$('idle').classList.add('show'),(hub.idle_seconds||90)*1000)}
function wake(){$('idle').classList.remove('show');resetIdle()}
['click','touchstart','mousemove','keydown'].forEach(e=>document.addEventListener(e,resetIdle,{passive:true}));
boot().catch(()=>{});
</script>
</body></html>
