<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061827"><title>USSA SMART HUB · V2</title>
<style>
:root{--navy:#061827;--card:#0b2740;--card2:#0e304e;--yellow:#ffca18;--white:#f7f9fb;--muted:#a8b8c7;--line:#294964;--green:#35d07f}*{box-sizing:border-box}html,body{margin:0;background:#061827;color:var(--white);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100vh}.app{width:min(100vw,1080px);min-height:100vh;margin:auto;padding:18px;background:linear-gradient(180deg,#071a2c,#061827)}button{font:inherit}.header{height:116px;display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:16px;border-bottom:1px solid var(--line);margin-bottom:14px}.logo{width:82px;height:82px;object-fit:contain}.brand{font-size:34px;font-weight:950;letter-spacing:.2px}.brand b{color:var(--yellow)}.datetime{text-align:right}.clock{font-size:34px;font-weight:950}.date{color:var(--yellow);font-weight:850;font-size:13px}.home{height:calc(100vh - 148px);display:grid;grid-template-rows:30% 18% 1fr;gap:12px}.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;overflow:hidden}.head{height:54px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(41,73,100,.7)}.head h2{margin:0;color:var(--yellow);font-size:21px}.hint{font-size:11px;color:var(--muted)}.schedule{height:calc(100% - 54px);overflow-y:auto;overscroll-behavior:contain;padding:8px 12px 14px;scrollbar-width:thin}.appointment{width:100%;display:grid;grid-template-columns:92px 1fr 26px;gap:10px;align-items:center;text-align:left;border:0;border-bottom:1px solid rgba(41,73,100,.7);background:transparent;color:white;padding:10px 4px;cursor:pointer}.appointment:last-child{border-bottom:0}.appointment .day{font-size:12px;font-weight:900}.appointment .time{font-size:22px;color:var(--yellow);font-weight:950}.appointment .kind{font-size:10px;color:var(--yellow);font-weight:900}.appointment .title{font-size:15px;font-weight:900;margin-top:2px}.appointment .meta{font-size:11px;color:var(--muted);margin-top:3px}.chev{font-size:24px;color:var(--muted)}.middle{display:grid;grid-template-columns:1.55fr .85fr;gap:12px}.now,.info{height:100%;padding:15px 17px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,var(--card2),var(--card));color:white}.now{position:relative;text-align:left}.eyebrow{font-size:12px;font-weight:950;color:var(--yellow);letter-spacing:.4px}.now-title{font-size:25px;font-weight:950;margin-top:8px}.now-meta{font-size:13px;color:var(--muted);margin-top:5px}.dots{position:absolute;right:16px;bottom:12px;color:var(--muted);letter-spacing:4px}.info{display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}.info-icon{font-size:40px;font-weight:300}.info-label{font-size:17px;font-weight:950;margin-top:3px}.open{margin-top:8px;font-size:11px;font-weight:950;color:var(--green);text-align:center;display:none}.open.show{display:block}.teams{display:flex;flex-direction:column}.team-grid{padding:10px 12px 14px;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:8px;height:calc(100% - 54px)}.team{border:1px solid #8b7113;border-radius:13px;background:#0a243b;color:white;padding:7px;cursor:pointer;min-height:0}.team .sport{font-size:9px;color:var(--yellow);font-weight:900}.team .name{font-size:13px;font-weight:950;margin-top:3px;line-height:1.05}.overlay{position:fixed;inset:0;background:#061827;z-index:20;display:none;overflow:auto}.overlay.show{display:block}.screen{width:min(100vw,1080px);min-height:100vh;margin:auto;padding:18px}.screenbar{height:74px;display:grid;grid-template-columns:72px 1fr 72px;align-items:center;border-bottom:1px solid var(--line);margin-bottom:16px}.backbtn{border:1px solid var(--line);border-radius:12px;background:var(--card);color:white;padding:11px;cursor:pointer}.screentitle{text-align:center;color:var(--yellow);font-size:25px;font-weight:950}.profile{display:grid;gap:12px}.hero,.section{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:18px}.hero h1{margin:0;color:var(--yellow);font-size:34px}.hero p{margin:5px 0 0;color:var(--muted);font-weight:800}.profilegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.section h3{margin:0 0 10px;color:var(--yellow);font-size:15px}.empty{color:var(--muted);font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{min-height:90px;border:1px solid var(--line);border-radius:15px;background:var(--card2);color:white;font-weight:950;font-size:17px;cursor:pointer}.action.wide{grid-column:1/-1}.loading{position:fixed;inset:0;z-index:50;background:rgba(3,13,22,.9);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}.loading.show{display:flex}.spinner{width:48px;height:48px;border:4px solid #294964;border-top-color:var(--yellow);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.loading strong{font-size:18px}.data-list{display:grid;gap:8px}.matchcard{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:14px}.matchcard b{color:var(--yellow)}table{width:100%;border-collapse:collapse;font-size:13px}th{position:sticky;top:0;background:#071a2c;color:var(--yellow);padding:10px 6px;text-align:left}td{padding:10px 6px;border-bottom:1px solid var(--line)}tr.us td{background:var(--yellow);color:#07131d;font-weight:950}.info-menu{display:grid;gap:12px}.info-block{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:18px}.info-block h3{margin:0 0 8px;color:var(--yellow)}@media(max-width:600px){.app,.screen{padding:10px}.header{height:96px;grid-template-columns:70px 1fr auto}.logo{width:62px;height:62px}.brand{font-size:22px}.clock{font-size:24px}.home{height:calc(100vh - 116px);grid-template-rows:30% 19% 1fr}.middle{grid-template-columns:1.35fr .75fr}.team-grid{gap:5px}.team .name{font-size:10px}.profilegrid{grid-template-columns:1fr}}
</style></head><body><div class="app"><header class="header"><img class="logo" src="/assets/ussa-logo.png" alt="USSA Rozzano"><div class="brand">USSA <b>SMART HUB</b></div><div class="datetime"><div id="clock" class="clock">--:--</div><div id="date" class="date"></div></div></header><main class="home"><section class="card"><div class="head"><h2>PROSSIMI APPUNTAMENTI</h2><span class="hint">Scorri per vedere i successivi</span></div><div id="schedule" class="schedule"><div class="empty">Caricamento appuntamenti…</div></div></section><section class="middle"><div id="now" class="now"><div class="eyebrow">ORA IN CAMPO</div><div id="nowTitle" class="now-title">Nessuna attività in corso</div><div id="nowMeta" class="now-meta"></div><div id="dots" class="dots"></div></div><button class="info" onclick="openInfo()"><div class="info-icon">ⓘ</div><div class="info-label">INFO</div><div id="secretaryOpen" class="open">● SEGRETERIA APERTA ORA</div></button></section><section class="card teams"><div class="head"><h2>LE NOSTRE SQUADRE</h2></div><div id="teams" class="team-grid"></div></section></main></div><div id="overlay" class="overlay"><div class="screen"><div class="screenbar"><button class="backbtn" onclick="closeOverlay()">←</button><div id="screenTitle" class="screentitle"></div><div></div></div><div id="screenBody"></div></div></div><div id="loading" class="loading"><div class="spinner"></div><strong>Caricamento…</strong></div>
<script>
let teams=[], hub={}, currentTeam=null, idleTimer;const $=id=>document.getElementById(id);const esc=s=>(s??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function tick(){const n=new Date();$('clock').textContent=n.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});$('date').textContent=n.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'}).toUpperCase();updateSecretary(n)}setInterval(tick,1000);tick();
function updateSecretary(n){if(!hub.secretariat)return;let day=n.getDay()||7,m=n.getHours()*60+n.getMinutes(),[oh,om]=hub.secretariat.open.split(':').map(Number),[ch,cm]=hub.secretariat.close.split(':').map(Number);$('secretaryOpen').classList.toggle('show',hub.secretariat.days.includes(day)&&m>=oh*60+om&&m<ch*60+cm)}
function loading(v){$('loading').classList.toggle('show',v)}async function getJSON(u){let r=await fetch(u);if(!r.ok)throw Error('Dati momentaneamente non disponibili');return r.json()}
function sportIcon(s){return s.includes('VOLLEY')?'🏐':s.includes('BASKET')?'🏀':'⚽'}
async function boot(){[teams,hub]=await Promise.all([getJSON('/api/teams'),getJSON('/api/hub')]);renderTeams();await Promise.allSettled([loadSchedule(),loadNow()]);resetIdle()}function renderTeams(){$('teams').innerHTML=teams.filter(t=>t.visible!==false).map(t=>`<button class="team" onclick="openTeam('${t.key}')"><div class="sport">${sportIcon(t.sport)} ${esc(t.sport)}</div><div class="name">${esc(t.label)}</div></button>`).join('')}
async function loadSchedule(){try{let d=await getJSON('/api/home/upcoming');if(!d.items.length){$('schedule').innerHTML='<div class="empty">Nessun prossimo appuntamento disponibile.</div>';return}$('schedule').innerHTML=d.items.map((x,i)=>`<button class="appointment" onclick="openAppointment(${i})"><div><div class="day">${esc(x.day||x.date||'')}</div><div class="time">${esc(x.time||'')}</div></div><div><div class="kind">${esc(x.kind||'PARTITA')}</div><div class="title">${esc(x.title||'')}</div><div class="meta">${esc(x.meta||'')}</div></div><div class="chev">›</div></button>`).join('');window.homeItems=d.items}catch(e){$('schedule').innerHTML='<div class="empty">Dati momentaneamente non disponibili.</div>'}}
async function loadNow(){try{let d=await getJSON('/api/home/now');let arr=d.items||[];if(!arr.length)return;let i=0;function show(){let x=arr[i%arr.length];$('nowTitle').textContent=x.title;$('nowMeta').textContent=x.meta||'';$('dots').textContent=arr.length>1?arr.map((_,j)=>j===i%arr.length?'●':'○').join(' '):'';i++}show();if(arr.length>1)setInterval(show,5500)}catch(e){}}
function openAppointment(i){let x=window.homeItems[i];openOverlay(x.kind==='EVENTO'?x.title:'DETTAGLIO APPUNTAMENTO',`<div class="hero"><h1>${esc(x.title)}</h1><p>${esc([x.date,x.time].filter(Boolean).join(' · '))}</p></div><div class="section"><h3>${x.kind==='EVENTO'?'INFORMAZIONI EVENTO':'PARTITA'}</h3><div>${esc(x.description||x.meta||'')}</div>${x.field?`<p>📍 <b>${esc(x.field)}</b><br>${esc(x.address||'')}</p>`:''}</div>`)}
async function openTeam(k){currentTeam=teams.find(t=>t.key===k);let tr=(currentTeam.training||[]).map(x=>`${esc(x.day)} · ${esc(x.start)}–${esc(x.end)}${x.place?' · '+esc(x.place):''}`).join('<br>')||'<span class="empty">Da inserire dal database USSA</span>';let st=(currentTeam.staff||[]).map(x=>`${esc(x.role)}: <b>${esc(x.name)}</b>`).join('<br>')||'<span class="empty">Da inserire dal database USSA</span>';openOverlay(currentTeam.label,`<div class="profile"><div class="hero"><h1>${esc(currentTeam.label)}</h1><p>${sportIcon(currentTeam.sport)} ${esc(currentTeam.sport)}</p></div><div class="profilegrid"><div class="section"><h3>ALLENAMENTI</h3>${tr}</div><div class="section"><h3>STAFF</h3>${st}</div></div><div class="actions">${currentTeam.classifica?'<button class="action" onclick="loadTeamData(\'standings\')">CLASSIFICA</button>':''}${currentTeam.marcatori?'<button class="action" onclick="loadTeamData(\'players\')">MARCATORI</button>':''}<button class="action" onclick="loadTeamData('matches')">GARE DISPUTATE</button><button class="action" onclick="loadTeamData('next')">PROSSIME PARTITE</button><button class="action wide" onclick="showRoster()">ROSA & STAFF</button></div></div>`)}
async function loadTeamData(type){loading(true);try{let d=await getJSON(`/api/team/${currentTeam.key}/${type}`);let html='';if(type==='standings'){let r=d.standings||[];html=`<div class="section"><table><thead><tr><th>POS</th><th>SQUADRA</th><th>G</th><th>V</th><th>N</th><th>P</th><th>PT</th></tr></thead><tbody>${r.map(x=>`<tr class="${(x.team||'').toUpperCase().includes('USSA')?'us':''}"><td>${x.position??''}</td><td>${esc(x.team)}</td><td>${x.played??''}</td><td>${x.wins??''}</td><td>${x.draws??0}</td><td>${x.losses??''}</td><td>${x.points??''}</td></tr>`).join('')}</tbody></table></div>`}else if(type==='players'){html=`<div class="section"><table><thead><tr><th>POS</th><th>GIOCATORE</th><th>GOL</th></tr></thead><tbody>${(d.players||[]).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${x.goals}</td></tr>`).join('')}</tbody></table></div>`}else{let a=d.matches||[];if(type==='matches')a=a.filter(x=>x.result);html=`<div class="data-list">${a.length?a.map(x=>`<div class="matchcard"><b>${esc(x.date)} ${esc(x.time)}</b><div>${esc(x.home)} ${x.result?'<b>'+esc(x.result)+'</b>':'–'} ${esc(x.away)}</div>${x.field?`<div class="empty">📍 ${esc(x.field)}</div>`:''}${type==='matches'?'<button class="backbtn" style="margin-top:8px">DETTAGLIO GARA</button>':''}${type==='next'&&x.address?`<div class="empty">${esc(x.address)}</div>`:''}</div>`).join(''):'<div class="empty">Nessun dato disponibile.</div>'}</div>`}$('screenBody').innerHTML=html;$('screenTitle').textContent=({standings:'CLASSIFICA',players:'MARCATORI',matches:'GARE DISPUTATE',next:'PROSSIME PARTITE'})[type]}catch(e){$('screenBody').innerHTML='<div class="section"><div class="empty">Dati momentaneamente non disponibili.</div></div>'}finally{loading(false)}}
function showRoster(){let a=currentTeam.roster||[];$('screenTitle').textContent='ROSA & STAFF';$('screenBody').innerHTML=`<div class="section"><h3>ROSA</h3>${a.length?a.map(x=>`<div>${esc(x.name)}</div>`).join(''):'<div class="empty">Rosa da collegare all’Albo CSI / database USSA.</div>'}</div>`}
function openInfo(){let s=hub.secretariat||{};openOverlay('INFORMAZIONI',`<div class="info-menu"><div class="info-block"><h3>SEGRETERIA & CONTATTI</h3><b>${esc(s.label||'')}</b> · ${esc(s.open||'')}–${esc(s.close||'')}<div class="empty" style="margin-top:8px">Recapiti e QR configurabili dal backend.</div></div><div class="info-block"><h3>SOCIAL</h3><div class="empty">Instagram · Facebook · QR</div></div><div class="info-block"><h3>DIRIGENZA</h3><div class="empty">Figurine con foto, nome e incarico.</div></div><div class="info-block"><h3>SPONSOR & PARTNER</h3><div class="empty">Elenco partner e relativi recapiti utili.</div></div></div>`)}
function openOverlay(title,html){$('screenTitle').textContent=title;$('screenBody').innerHTML=html;$('overlay').classList.add('show');resetIdle()}function closeOverlay(){$('overlay').classList.remove('show');$('screenBody').innerHTML='';currentTeam=null;resetIdle()}function resetIdle(){clearTimeout(idleTimer);idleTimer=setTimeout(()=>{closeOverlay()},(hub.idle_seconds||90)*1000)}['pointerdown','touchstart','keydown'].forEach(e=>document.addEventListener(e,resetIdle,{passive:true}));boot().catch(()=>{});
</script></body></html>
