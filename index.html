function showOverlay(title,body){$('screenTitle').textContent=title;$('screenBody').innerHTML=body;$('overlay').classList.add('show');document.querySelector('#overlay .screen').scrollTop=0}
function hideOverlay(){$('overlay').classList.remove('show');$('screenBody').innerHTML='';if(activeMap){try{activeMap.remove()}catch{}activeMap=null}}
function navigate(view){navStack.push({...currentView});currentView=view;renderCurrent()}
function replaceView(view){currentView=view;renderCurrent()}
function goBack(){if(navStack.length){currentView=navStack.pop();renderCurrent()}else{goHome()}}
function goHome(){navStack=[];currentView={type:'home'};hideOverlay();window.scrollTo(0,0)}
async function renderCurrent(){if(activeMap){try{activeMap.remove()}catch{}activeMap=null}if(currentView.type==='home'){hideOverlay();return}if(currentView.type==='team'){await renderTeamView(currentView);return}if(currentView.type==='fixture'){await renderFixtureView(currentView);return}if(currentView.type==='map'){await renderMapView(currentView);return}if(currentView.type==='csi'){await renderCsiView(currentView);return}if(currentView.type==='info'){renderInfoView();return}if(currentView.type==='event'){renderEventView(currentView.item);return}}
function trainingHTML(t){let a=t.training||[];return a.length?`<div class="kv">${a.map(x=>`<div class="kvrow"><b>${esc(x.day)}</b><span>${esc(x.start)}–${esc(x.end)} · ${esc(x.place)}</span></div>`).join('')}</div>`:'<div class="empty">Allenamenti non ancora inseriti.</div>'}
function initials(n){return n.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function staffHTML(t){let a=t.staff||[],coll=t.collaborators||[];let main=a.length?`<div class="staffgrid">${a.map(x=>`<div class="staffcard"><div class="staffphoto">${x.photo?`<img src="${esc(x.photo)}">`:esc(initials(x.name))}</div><div class="staffrole">${esc(x.role)}</div><div class="staffname">${esc(x.name)}</div></div>`).join('')}</div>`:'<div class="empty">Staff non disponibile.</div>';if(coll.length)main+=`<div class="collabs"><h3>COLLABORATORI</h3>${coll.map(x=>`<div class="kvrow"><b>${esc(x.name)}</b><span>${esc(x.role||'Collaboratore')}</span></div>`).join('')}</div>`;return main}
function openTeam(key){let t=teams.find(x=>x.key===key);if(!t)return;let comp=t.default_competition||(t.competitions?.[0])||'CSI';navigate({type:'team',key,comp,tab:null})}
async function renderTeamView(v){currentTeam=teams.find(x=>x.key===v.key);if(!currentTeam)return;currentCompetition=v.comp;teamTab=v.tab;let t=currentTeam,comps=t.competitions||[];let compHTML=comps.length>1?`<div class="comp-row">${comps.map(c=>`<button class="compbtn ${c===currentCompetition?'active':''}" onclick="changeCompetition('${c}')">${c}</button>`).join('')}</div>`:'';showOverlay(t.label,`<div class="hero"><h1>${esc(t.label)}</h1><p>${esc(t.sport)}${t.test_only?' · SQUADRA TEST CSI':''}</p></div><div class="section training-fixed"><h3>ALLENAMENTI</h3>${trainingHTML(t)}</div>${compHTML}<div id="teamActions" class="actions"></div><div id="dynamic" class="dynamic"></div>`);await refreshAvailability();if(teamTab)await selectTeamTab(teamTab,true);else $('dynamic').innerHTML='<div class="section"><h3>SQUADRA</h3><div class="empty">Scegli una sezione disponibile per consultare i contenuti.</div></div>'}
function changeCompetition(c){currentCompetition=c;teamTab=null;replaceView({type:'team',key:currentTeam.key,comp:c,tab:null})}
async function refreshAvailability(){let a={};try{a=await getJSON(`/api/team/${currentTeam.key}/availability?competition=${encodeURIComponent(currentCompetition)}`)}catch{}let labels={standings:'CLASSIFICA',scorers:'MARCATORI',played:'GARE DISPUTATE',next:'PROSSIME PARTITE'};let order=['standings','scorers','played','next'];$('teamActions').innerHTML=`<button class="action ${teamTab==='staff'?'active':''}" onclick="selectTeamTab('staff')">STAFF</button>`+order.filter(k=>a[k]).map(k=>`<button class="action ${teamTab===k?'active':''}" onclick="selectTeamTab('${k}')">${labels[k]}</button>`).join('')}
async function selectTeamTab(tab,restoring=false){teamTab=tab;currentView={type:'team',key:currentTeam.key,comp:currentCompetition,tab};await refreshAvailability();let box=$('dynamic');if(tab==='staff'){box.innerHTML=`<div class="section"><h3>STAFF</h3>${staffHTML(currentTeam)}</div>`;return}loading(true);try{if(tab==='standings'){let d=await getJSON(`/api/team/${currentTeam.key}/standings?competition=${currentCompetition}`);box.innerHTML=`<div class="section"><h3>CLASSIFICA · ${currentCompetition}</h3><table><thead><tr><th>POS</th><th>SQUADRA</th><th>G</th><th>V</th><th>N</th><th>P</th><th>PT</th></tr></thead><tbody>${(d.standings||[]).map(x=>`<tr class="${String(x.team).toUpperCase().includes('USSA')?'us':''}"><td>${x.position??''}</td><td><b>${esc(x.team)}</b></td><td>${x.played??''}</td><td>${x.wins??''}</td><td>${x.draws??''}</td><td>${x.losses??''}</td><td><b>${x.points??''}</b></td></tr>`).join('')}</tbody></table></div>`}else if(tab==='scorers'){let d=await getJSON(`/api/team/${currentTeam.key}/players?competition=${currentCompetition}`);box.innerHTML=`<div class="section"><h3>MARCATORI · ${currentCompetition}</h3><table><thead><tr><th>POS</th><th>GIOCATORE</th><th>GOL</th></tr></thead><tbody>${(d.players||[]).map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.name)}</b></td><td><b>${x.goals}</b></td></tr>`).join('')}</tbody></table></div>`}else{let ep=tab==='played'?'matches':'next',d=await getJSON(`/api/team/${currentTeam.key}/${ep}?competition=${currentCompetition}`),played=tab==='played';box.innerHTML=(d.matches||[]).map(x=>matchCard(x,played)).join('')||'<div class="section"><div class="empty">Nessun dato disponibile.</div></div>'}}catch(e){box.innerHTML='<div class="section"><div class="empty">Dati momentaneamente non disponibili.</div></div>'}finally{loading(false)}}
function matchCard(x,played){let title=x.home&&x.away?`${x.home} – ${x.away}`:(x.names?.length?x.names.slice(-2).join(' – '):x.raw||'Partita USSA');let click=x.id?`openFixtureDetail('${x.id}')`:(x.detail_url?`openCsiDetail(${JSON.stringify(x.detail_url)})`:``);return `<div class="matchcard" ${click?`onclick='${click}'`:''}><div class="matchhead"><div><div class="matchdate">${fmtDate(x.date).long.toUpperCase()} · ${esc(x.time||'')}</div><div class="matchtitle">${esc(title)}</div><div class="small">${esc(x.field||x.competition||currentCompetition)}${x.address?' · '+esc(x.address):''}</div></div>${x.home_away?`<div class="pill">${esc(x.home_away)}</div>`:''}</div>${click?`<div class="detailhint">${played?'DETTAGLIO GARA':'INFO PARTITA'} ›</div>`:''}</div>`}
function openAppointment(x){if(x.kind==='EVENTO')navigate({type:'event',item:x});else if(x.id)navigate({type:'fixture',id:x.id})}
function openFixtureDetail(id){navigate({type:'fixture',id})}
function clubVisual(name){let c=CLUBS[String(name).toUpperCase()]||{};let isUSSA=String(name).toUpperCase().includes('USSA');if(c.logo){let sty=c.crop?'object-fit:cover;object-position:74% 23%;transform:scale(2.55);':'';return `<div class="club-logo-wrap"><img class="club-logo" src="${c.logo}" alt="${esc(name)}" style="${sty}" onerror="this.parentElement.innerHTML='<div class=&quot;club-fallback&quot;>${esc(c.abbr||initials(name))}</div>'"></div>`}return `<div class="club-logo-wrap"><div class="club-fallback">${esc(c.abbr||initials(name))}</div></div>`}
async function fixtureStats(id){try{return await getJSON(`/api/fixture/${id}/stats`)}catch{return null}}
function statSide(r,side){
  r=r||{};let pos=r.position?`${r.position}ª`:'—',form=(r.form||[]).join(' · ')||'—';
  return `<div class="stats-side ${side}"><div class="stats-name">${esc(r.team||'')}</div><div class="stat-cell"><div class="stat-val">${pos}</div><div class="stat-lab">POS.</div></div><div class="stat-cell"><div class="stat-val">${r.points??0}</div><div class="stat-lab">PUNTI</div></div><div class="stat-cell"><div class="stat-val">${r.played??0}</div><div class="stat-lab">GIOCATE</div></div><div class="stat-cell"><div class="stat-val">${r.wins??0}-${r.draws??0}-${r.losses??0}</div><div class="stat-lab">V-N-P</div></div><div class="stat-cell"><div class="stat-val">${r.gf??0}</div><div class="stat-lab">GF</div></div><div class="stat-cell"><div class="stat-val">${r.ga??0}</div><div class="stat-lab">GS</div></div><div class="formline" style="grid-column:1/-1">${form}</div></div>`
}
function statsHTML(s){if(!s)return '';return `<section class="stats-card"><h3>STATS</h3><div class="stats-grid">${statSide(s.home,'left')}<div class="stats-mid"><span>CONFRONTO</span><span>ULTIME GARE</span></div>${statSide(s.away,'right')}</div></section>`}
async function renderFixtureView(v){
  loading(true);
  try{
    let [x,st]=await Promise.all([getJSON(`/api/fixture/${v.id}`),fixtureStats(v.id)]),home=x.home_away==='CASA',f=fmtDate(x.date);
    let route=null;if(!home){try{route=await getJSON(`/api/static-route/${x.id}`)}catch{}}
    const place=`<section class="fixture-place ${home?'home-only':''}"><div><h3>DOVE SI GIOCA</h3><div class="place-title">${esc(x.field)}</div><div class="place-address">${esc(x.address)}</div></div>${home?'':`<div class="place-route"><div class="route-number">${route?`<strong>${route.km} km</strong> · ${route.minutes} min`:'<strong>PERCORSO</strong>'}</div><div class="route-note">da USSA Stadium · indicativo</div></div>`}</section>`;
    const awayMap=home?'':`<section class="route-map-card"><div class="route-map-head"><b>PERCORSO INDICATIVO</b><span>USSA Stadium → ${esc(x.field)}</span></div><div id="routeMap" class="route-map"></div></section>`;
    const tools=home?
      `<section class="fixture-tools home-tools"><div class="qrpanel"><img alt="QR calendario" src="/api/qr/calendar/${x.id}.svg"><div><h3>AGGIUNGI AL CALENDARIO</h3><p>Scansiona per salvare partita, data, ora, campo e indirizzo sul telefono.</p></div></div></section>`:
      `<section class="fixture-tools"><div class="qrpanel"><img alt="QR percorso" src="/api/qr/route/${x.id}.svg"><div><h3>PERCORSO SUL TELEFONO</h3><p>Scansiona per aprire la navigazione reale sul telefono.</p></div></div><div class="qrpanel"><img alt="QR calendario" src="/api/qr/calendar/${x.id}.svg"><div><h3>AGGIUNGI AL CALENDARIO</h3><p>Scansiona per salvare partita, data, ora, campo e indirizzo.</p></div></div></section>`;
    const mapAction=home?'':`<section class="map-action-panel"><div><h3>MAPPA E PERCORSO</h3><p>Ingrandisci la stessa mappa indicativa.</p></div><button class="map-cta" onclick="openFixtureMap('${x.id}')">APRI MAPPA</button></section>`;
    showOverlay('PARTITA',`<div class="fixture-layout2 ${home?'home-fixture':'away-fixture'}"><section class="fixture-stage"><div class="fixture-stage-top"><span>UNDER 14</span><span>·</span><span>${esc(x.competition)}</span><span>·</span><span>GIORNATA ${x.round}</span></div><div class="fixture-clubs"><div class="club-side ${String(x.home).includes('USSA')?'club-us':''}">${clubVisual(x.home)}<div class="club-name">${esc(x.home)}</div></div><div class="vsmark">VS</div><div class="club-side ${String(x.away).includes('USSA')?'club-us':''}">${clubVisual(x.away)}<div class="club-name">${esc(x.away)}</div></div></div><div class="fixture-when3"><span class="datepart">${f.long}</span><span class="dot"></span><span class="timepart">${esc(x.time)}</span></div></section>${statsHTML(st)}${place}${awayMap}${mapAction}${tools}</div>`);
    if(!home && route) requestAnimationFrame(()=>buildCartographicRouteMap($('routeMap'),route,x));
  }catch(e){showOverlay('PARTITA','<div class="section"><div class="empty">Partita momentaneamente non disponibile.</div></div>')}finally{loading(false)}
}
function mercatorWorld(lon,lat,z){
  const scale=256*Math.pow(2,z),x=(lon+180)/360*scale,s=Math.sin(lat*Math.PI/180),y=(.5-Math.log((1+s)/(1-s))/(4*Math.PI))*scale;return [x,y]
}
function buildCartographicRouteMap(el,r,x){
  if(!el||!r)return;const g=r.geometry||[];if(g.length<2){el.innerHTML='<div class="map-status">Percorso non predisposto.</div>';return}
  const W=Math.max(320,el.clientWidth||900),H=Math.max(220,el.clientHeight||360),xs=g.map(p=>p[0]),ys=g.map(p=>p[1]);
  const minLon=Math.min(...xs),maxLon=Math.max(...xs),minLat=Math.min(...ys),maxLat=Math.max(...ys);
  let z=15,chosen=null;
  for(;z>=9;z--){const a=mercatorWorld(minLon,maxLat,z),b=mercatorWorld(maxLon,minLat,z),bw=Math.abs(b[0]-a[0]),bh=Math.abs(b[1]-a[1]);if(bw<=W*.72&&bh<=H*.68){chosen={z,a,b};break}}
  if(!chosen){z=9;chosen={z,a:mercatorWorld(minLon,maxLat,z),b:mercatorWorld(maxLon,minLat,z)}}
  const centerLon=(minLon+maxLon)/2,centerLat=(minLat+maxLat)/2,center=mercatorWorld(centerLon,centerLat,z),left=center[0]-W/2,top=center[1]-H/2;
  el.innerHTML='<div class="osm-map"><div class="osm-tile-layer"></div><svg class="osm-route-svg"></svg><div class="osm-map-note"></div><div class="osm-attrib">© OpenStreetMap contributors</div></div>';
  const map=el.querySelector('.osm-map'),layer=map.querySelector('.osm-tile-layer'),svg=map.querySelector('.osm-route-svg'),note=map.querySelector('.osm-map-note');note.textContent=`${r.km} km · circa ${r.minutes} min · percorso indicativo`;
  const n=Math.pow(2,z),tx0=Math.floor(left/256)-1,tx1=Math.floor((left+W)/256)+1,ty0=Math.floor(top/256)-1,ty1=Math.floor((top+H)/256)+1;
  for(let tx=tx0;tx<=tx1;tx++)for(let ty=ty0;ty<=ty1;ty++){if(ty<0||ty>=n)continue;const xx=((tx%n)+n)%n,img=document.createElement('img');img.className='osm-tile';img.alt='';img.loading='eager';img.decoding='async';img.referrerPolicy='no-referrer';img.src=`https://tile.openstreetmap.org/${z}/${xx}/${ty}.png`;img.style.left=(tx*256-left)+'px';img.style.top=(ty*256-top)+'px';layer.appendChild(img)}
  const pts=g.map(p=>{const w=mercatorWorld(p[0],p[1],z);return [w[0]-left,w[1]-top]}),points=pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML=`<polyline class="osm-route-shadow" points="${points}"></polyline><polyline class="osm-route-line" points="${points}"></polyline>`;
  const addMarker=(p,label,kind)=>{const m=document.createElement('div');m.className='osm-marker '+kind;m.style.left=p[0]+'px';m.style.top=p[1]+'px';map.appendChild(m);const l=document.createElement('div');l.className='osm-label';l.textContent=label;l.style.left=p[0]+'px';l.style.top=p[1]+'px';map.appendChild(l)};
  addMarker(pts[0],'USSA Stadium','start');addMarker(pts[pts.length-1],x.field,'end');
}
function openFixtureMap(id){navigate({type:'map',id})}
async function renderMapView(v){loading(true);try{let x=await getJSON(`/api/fixture/${v.id}`);if(x.home_away==='CASA'){goBack();return}let r=await getJSON(`/api/static-route/${x.id}`);showOverlay('MAPPA E PERCORSO',`<div class="fullmap-layout2"><div class="fullmap-info2"><h2>${esc(x.field)}</h2><p>${esc(x.address)} · ${r.km} km · circa ${r.minutes} min da USSA Stadium</p></div><div id="fullRouteMap" class="fullroute-map"></div></div>`);requestAnimationFrame(()=>buildCartographicRouteMap($('fullRouteMap'),r,x))}catch{showOverlay('MAPPA E PERCORSO','<div class="section"><div class="empty">Percorso non predisposto.</div></div>')}finally{loading(false)}}

async function renderCsiView(v){loading(true);try{let d=await getJSON(`/api/game-detail?url=${encodeURIComponent(v.url)}`);showOverlay('DETTAGLIO GARA',`<div class="hero"><h1>${esc(d.score||'PARTITA')}</h1><p>${esc(d.title||'')}</p></div>${d.field?`<div class="section"><h3>CAMPO</h3>${esc(d.field)}</div>`:''}<div class="section"><h3>CRONOLOGIA</h3>${(d.events||[]).length?d.events.map(x=>`<div class="matchcard">${esc(x)}</div>`).join(''):'<div class="empty">Nessun evento di cronaca pubblicato.</div>'}</div>`)}catch{showOverlay('DETTAGLIO GARA','<div class="section"><div class="empty">Dettaglio CSI momentaneamente non disponibile.</div></div>')}finally{loading(false)}}

function openInfo(){navigate({type:'info'})}function renderInfoView(){let sec=hub.secretariat||{};showOverlay('INFO',`<div class="info-menu"><div class="infocard"><h3>SEGRETERIA</h3><div class="kv"><div class="kvrow"><b>Orari</b><span>${esc(sec.label||'')} · ${esc(sec.open||'')}–${esc(sec.close||'')}</span></div></div></div><div class="infocard"><h3>SOCIAL & CONTATTI</h3><div class="empty">Area predisposta per contatti, social e QR.</div></div><div class="infocard"><h3>DIRIGENZA</h3><div class="empty">Area predisposta.</div></div><div class="infocard"><h3>PARTNER & SPONSOR</h3><div class="empty">Area predisposta.</div></div></div>`)}

function resetIdle(){clearTimeout(idleTimer);$('idle').classList.remove('show');idleTimer=setTimeout(()=>$('idle').classList.add('show'),(hub.idle_seconds||90)*1000)}function wake(){$('idle').classList.remove('show');resetIdle()}['click','touchstart','mousemove','keydown'].forEach(e=>document.addEventListener(e,resetIdle,{passive:true}));boot().catch(console.error);
</script></body></html>
